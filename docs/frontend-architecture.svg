<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A544D"/>
    </marker>
    <style>
      .t  { font-size:19px; font-weight:700; fill:#1E2420; }
      .s  { font-size:14px; fill:#3B443E; }
      .xs { font-size:12.5px; fill:#6B736C; }
      .m  { font-size:11.5px; fill:#2F3B35; font-family:Consolas,'Courier New',monospace; }
      .ct { font-size:15px; font-weight:700; fill:#1E2420; }
      .bn { font-size:14px; font-weight:700; fill:#1E2420; }
      .ln { stroke:#4A544D; stroke-width:2; fill:none; marker-end:url(#arr); }
      .dl { stroke:#4A544D; stroke-width:2; fill:none; stroke-dasharray:6 5; marker-end:url(#arr); }
      .lb { font-size:13px; fill:#4A544D; }
    </style>
  </defs>

  <rect width="1600" height="1390" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2420">SafeFlow 前端系統架構</text>
  <text x="800" y="76" text-anchor="middle" class="s">HTML5 · CSS3 · Vanilla JavaScript（ES Modules）· MapLibre GL JS</text>

  <!-- User -->
  <rect x="635" y="100" width="300" height="60" rx="30" fill="#1C211E"/>
  <text x="785" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#E3B341">使用者（手機瀏覽器）</text>

  <!-- Frontend container -->
  <rect x="40" y="195" width="1150" height="555" rx="18" fill="#F3F7F4" stroke="#2F6B4F" stroke-width="2"/>
  <text x="62" y="229" font-size="18" font-weight="700" fill="#2F6B4F">前端 Frontend</text>
  <text x="236" y="229" class="xs">由 Express 以靜態檔案提供（frontend/）</text>

  <!-- welcome.html -->
  <rect x="80" y="250" width="280" height="310" rx="14" fill="#FFFFFF" stroke="#9DBBA9" stroke-width="1.5"/>
  <text x="220" y="284" text-anchor="middle" class="t">welcome.html</text>
  <text x="220" y="306" text-anchor="middle" class="xs">歡迎頁</text>
  <text x="108" y="350" class="s">• 功能介紹（Onboarding）</text>
  <text x="108" y="385" class="s">• 會員登入 / 註冊</text>
  <text x="108" y="420" class="s">• 訪客模式</text>

  <!-- index.html -->
  <rect x="430" y="250" width="710" height="310" rx="14" fill="#FFFFFF" stroke="#9DBBA9" stroke-width="1.5"/>
  <text x="785" y="284" text-anchor="middle" class="t">index.html　主畫面（單頁應用 SPA）</text>

  <g>
    <rect x="450" y="302" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="527" y="330" text-anchor="middle" class="ct">首頁 / 地點 / 收藏</text>
    <text x="527" y="351" text-anchor="middle" class="xs">home · places · saved</text>

    <rect x="622" y="302" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="699" y="330" text-anchor="middle" class="ct">路線規劃</text>
    <text x="699" y="351" text-anchor="middle" class="xs">plan</text>

    <rect x="794" y="302" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="871" y="330" text-anchor="middle" class="ct">路線比較</text>
    <text x="871" y="351" text-anchor="middle" class="xs">compare</text>

    <rect x="966" y="302" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="1043" y="330" text-anchor="middle" class="ct">風險分析</text>
    <text x="1043" y="351" text-anchor="middle" class="xs">risk</text>

    <rect x="450" y="382" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="527" y="410" text-anchor="middle" class="ct">安全分析</text>
    <text x="527" y="431" text-anchor="middle" class="xs">safety</text>

    <rect x="622" y="382" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="699" y="410" text-anchor="middle" class="ct">出發時間建議</text>
    <text x="699" y="431" text-anchor="middle" class="xs">departure</text>

    <rect x="794" y="382" width="155" height="64" rx="10" fill="#DCE8DF"/>
    <text x="871" y="410" text-anchor="middle" class="ct">分流建議</text>
    <text x="871" y="431" text-anchor="middle" class="xs">diversion</text>

    <rect x="966" y="382" width="155" height="64" rx="10" fill="#F4E8CB"/>
    <text x="1043" y="410" text-anchor="middle" class="ct">導航模式</text>
    <text x="1043" y="431" text-anchor="middle" class="xs">drive（語音導航）</text>
  </g>
  <text x="785" y="490" text-anchor="middle" class="s">使用流程：路線規劃 → 路線比較 → 風險 / 安全分析 → 出發時間 / 分流建議 → 導航</text>
  <text x="785" y="520" text-anchor="middle" class="xs">底部分頁切換 · 地圖、路線與安全圖層即時更新</text>

  <!-- Shared modules -->
  <rect x="80" y="600" width="360" height="120" rx="14" fill="#FFFFFF" stroke="#9DBBA9" stroke-width="1.5"/>
  <text x="260" y="632" text-anchor="middle" class="t">session.js　共用模組</text>
  <text x="260" y="660" text-anchor="middle" class="s">登入狀態 / 訪客模式（Token）</text>
  <text x="260" y="683" text-anchor="middle" class="s">API 呼叫封裝（fetch）</text>
  <text x="260" y="706" text-anchor="middle" class="s">淺色 / 深色主題切換</text>

  <rect x="470" y="600" width="330" height="120" rx="14" fill="#FFFFFF" stroke="#9DBBA9" stroke-width="1.5"/>
  <text x="635" y="632" text-anchor="middle" class="t">介面樣式與圖示</text>
  <text x="635" y="660" text-anchor="middle" class="s">CSS 變數色彩主題</text>
  <text x="635" y="683" text-anchor="middle" class="s">Phosphor Icons（內嵌 SVG）</text>
  <text x="635" y="706" text-anchor="middle" class="s">手機版響應式版面</text>

  <rect x="830" y="600" width="310" height="120" rx="14" fill="#FFFFFF" stroke="#9DBBA9" stroke-width="1.5"/>
  <text x="985" y="632" text-anchor="middle" class="t">MapLibre GL JS 6.10</text>
  <text x="985" y="658" text-anchor="middle" class="s">向量地圖 · 路線 / 風險 / 安全圖層</text>
  <text x="985" y="680" text-anchor="middle" class="s">路燈、便利商店標記</text>
  <text x="985" y="704" text-anchor="middle" class="m">Map · Marker · Popup · GeoJSON Layer</text>

  <!-- Browser APIs -->
  <rect x="1230" y="250" width="330" height="316" rx="14" fill="#F1EEF6" stroke="#8A6FA0" stroke-width="2"/>
  <text x="1395" y="282" text-anchor="middle" class="t">瀏覽器 Web API</text>
  <g>
    <text x="1250" y="318" class="bn">fetch</text>                 <text x="1540" y="318" text-anchor="end" class="xs">呼叫後端 API</text>
    <text x="1250" y="339" class="bn">AbortSignal.timeout</text>   <text x="1540" y="339" text-anchor="end" class="xs">API 逾時控制</text>
    <text x="1250" y="360" class="bn">Geolocation</text>           <text x="1540" y="360" text-anchor="end" class="xs">取得目前位置</text>
    <text x="1250" y="381" class="bn">SpeechRecognition</text>     <text x="1540" y="381" text-anchor="end" class="xs">語音搜尋地點</text>
    <text x="1250" y="402" class="bn">SpeechSynthesis</text>       <text x="1540" y="402" text-anchor="end" class="xs">語音播報導航</text>
    <text x="1250" y="423" class="bn">localStorage</text>          <text x="1540" y="423" text-anchor="end" class="xs">登入 / 外觀 / 收藏</text>
    <text x="1250" y="444" class="bn">matchMedia</text>            <text x="1540" y="444" text-anchor="end" class="xs">跟隨系統深色模式</text>
    <text x="1250" y="465" class="bn">crypto.randomUUID</text>     <text x="1540" y="465" text-anchor="end" class="xs">匿名使用者 ID</text>
    <text x="1250" y="486" class="bn">URLSearchParams</text>       <text x="1540" y="486" text-anchor="end" class="xs">網址查詢參數</text>
    <text x="1250" y="507" class="bn">history.replaceState</text>  <text x="1540" y="507" text-anchor="end" class="xs">網址狀態更新</text>
    <text x="1250" y="528" class="bn">ResizeObserver</text>        <text x="1540" y="528" text-anchor="end" class="xs">版面尺寸偵測</text>
    <text x="1250" y="549" class="bn">CustomEvent</text>           <text x="1540" y="549" text-anchor="end" class="xs">主題切換事件</text>
  </g>

  <!-- External services (frontend direct) -->
  <rect x="1230" y="600" width="330" height="120" rx="14" fill="#FBF4E2" stroke="#C98A1B" stroke-width="2"/>
  <text x="1395" y="632" text-anchor="middle" class="t">前端直接使用的外部服務</text>
  <text x="1395" y="664" text-anchor="middle" class="s">OpenFreeMap 圖磚 / 字型（liberty / dark）</text>
  <text x="1395" y="694" text-anchor="middle" class="s">unpkg CDN（MapLibre 套件）</text>

  <!-- Backend -->
  <rect x="40" y="800" width="1520" height="210" rx="18" fill="#EEF2F7" stroke="#5B7FA6" stroke-width="2"/>
  <text x="62" y="836" font-size="18" font-weight="700" fill="#3D5F85">後端 Express Backend（localhost:3000）</text>
  <text x="1538" y="836" text-anchor="end" class="xs">前端呼叫的 14 個 REST API · JSON</text>

  <g>
    <rect x="60" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="160" y="886" text-anchor="middle" class="ct">會員驗證</text>
    <text x="160" y="912" text-anchor="middle" class="m">/api/auth/register</text>
    <text x="160" y="930" text-anchor="middle" class="m">/api/auth/login</text>
    <text x="160" y="948" text-anchor="middle" class="m">/api/auth/logout</text>
    <text x="160" y="966" text-anchor="middle" class="m">/api/auth/me</text>

    <rect x="273" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="373" y="886" text-anchor="middle" class="ct">地點搜尋</text>
    <text x="373" y="912" text-anchor="middle" class="m">/api/place-suggest</text>
    <text x="373" y="930" text-anchor="middle" class="m">/api/smart-geocode</text>

    <rect x="486" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="586" y="886" text-anchor="middle" class="ct">路線規劃</text>
    <text x="586" y="912" text-anchor="middle" class="m">/api/navigation/route</text>

    <rect x="699" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="799" y="886" text-anchor="middle" class="ct">安全分析</text>
    <text x="799" y="912" text-anchor="middle" class="m">/api/navigation/analyze</text>
    <text x="799" y="930" text-anchor="middle" class="m">/api/navigation/map-points</text>

    <rect x="912" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="1012" y="886" text-anchor="middle" class="ct">路線選擇紀錄</text>
    <text x="1012" y="912" text-anchor="middle" class="m">/api/navigation/choice</text>

    <rect x="1125" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="1225" y="886" text-anchor="middle" class="ct">地圖圖磚代理</text>
    <text x="1225" y="912" text-anchor="middle" class="m">/api/map/google/tiles</text>
    <text x="1225" y="930" text-anchor="middle" class="m">/api/map/google/viewport</text>
    <text x="1225" y="948" text-anchor="middle" class="m">/api/map/google/status</text>

    <rect x="1338" y="858" width="200" height="132" rx="10" fill="#FFFFFF" stroke="#B5C6DA"/>
    <text x="1438" y="886" text-anchor="middle" class="ct">系統狀態</text>
    <text x="1438" y="912" text-anchor="middle" class="m">/api/health</text>
  </g>

  <!-- Services behind the backend -->
  <rect x="40" y="1040" width="1520" height="190" rx="18" fill="#F7F7F5" stroke="#8E968C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="62" y="1074" font-size="18" font-weight="700" fill="#4A544D">後端串接的外部服務與資料</text>
  <text x="300" y="1074" class="xs">前端不直接呼叫，由後端代為取得</text>
  <g>
    <rect x="60"   y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="176"  y="1114" text-anchor="middle" class="bn">TDX 運輸資料流通服務</text>
    <text x="176"  y="1134" text-anchor="middle" class="xs">即時路況 · 大眾運輸</text>
    <rect x="310"  y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="426"  y="1114" text-anchor="middle" class="bn">Valhalla 路線引擎</text>
    <text x="426"  y="1134" text-anchor="middle" class="xs">本機 :8002 · 主要路線計算</text>
    <rect x="559"  y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="675"  y="1114" text-anchor="middle" class="bn">OSRM</text>
    <text x="675"  y="1134" text-anchor="middle" class="xs">備援路線 · 步行路線</text>
    <rect x="809"  y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="925"  y="1114" text-anchor="middle" class="bn">TomTom API</text>
    <text x="925"  y="1134" text-anchor="middle" class="xs">地點搜尋 · 汽車路線</text>
    <rect x="1058" y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="1174" y="1114" text-anchor="middle" class="bn">Google Map Tiles API</text>
    <text x="1174" y="1134" text-anchor="middle" class="xs">Google 底圖圖磚</text>
    <rect x="1308" y="1090" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="1424" y="1114" text-anchor="middle" class="bn">Groq AI API</text>
    <text x="1424" y="1134" text-anchor="middle" class="xs">地名文字正規化</text>

    <rect x="60"   y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="176"  y="1182" text-anchor="middle" class="bn">Photon（Komoot）</text>
    <text x="176"  y="1202" text-anchor="middle" class="xs">地點搜尋 · 反向地理編碼</text>
    <rect x="310"  y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="426"  y="1182" text-anchor="middle" class="bn">Nominatim（OSM）</text>
    <text x="426"  y="1202" text-anchor="middle" class="xs">地理編碼備援</text>
    <rect x="559"  y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="675"  y="1182" text-anchor="middle" class="bn">TGOS 地址定位</text>
    <text x="675"  y="1202" text-anchor="middle" class="xs">台灣門牌地址查詢</text>
    <rect x="809"  y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="925"  y="1182" text-anchor="middle" class="bn">Overpass API（OSM）</text>
    <text x="925"  y="1202" text-anchor="middle" class="xs">道路號誌資料</text>
    <rect x="1058" y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="1174" y="1182" text-anchor="middle" class="bn">SQLite 資料庫</text>
    <text x="1174" y="1202" text-anchor="middle" class="xs">路燈 · 便利商店 · 事故 · 會員</text>
    <rect x="1308" y="1158" width="232" height="56" rx="10" fill="#FFFFFF" stroke="#CDD1C8"/>
    <text x="1424" y="1182" text-anchor="middle" class="bn">Node.js 套件</text>
    <text x="1424" y="1202" text-anchor="middle" class="xs">Express 5 · Turf.js · better-sqlite3</text>
  </g>

  <!-- Dev tools -->
  <rect x="40" y="1260" width="1520" height="100" rx="18" fill="#FFFFFF" stroke="#CDD1C8" stroke-width="2"/>
  <text x="62" y="1306" font-size="18" font-weight="700" fill="#4A544D">開發與執行工具</text>
  <text x="62" y="1328" class="xs">Development tools</text>
  <g>
    <rect x="260"  y="1282" width="240" height="56" rx="10" fill="#F3F7F4" stroke="#CDD1C8"/>
    <text x="380"  y="1306" text-anchor="middle" class="bn">Visual Studio Code</text>
    <text x="380"  y="1326" text-anchor="middle" class="xs">程式編輯器</text>
    <rect x="520"  y="1282" width="240" height="56" rx="10" fill="#F3F7F4" stroke="#CDD1C8"/>
    <text x="640"  y="1306" text-anchor="middle" class="bn">Live Server</text>
    <text x="640"  y="1326" text-anchor="middle" class="xs">前端預覽 :5500 / :5501</text>
    <rect x="780"  y="1282" width="240" height="56" rx="10" fill="#F3F7F4" stroke="#CDD1C8"/>
    <text x="900"  y="1306" text-anchor="middle" class="bn">Node.js + npm</text>
    <text x="900"  y="1326" text-anchor="middle" class="xs">執行後端 · 套件管理</text>
    <rect x="1040" y="1282" width="240" height="56" rx="10" fill="#F3F7F4" stroke="#CDD1C8"/>
    <text x="1160" y="1306" text-anchor="middle" class="bn">Git / GitHub</text>
    <text x="1160" y="1326" text-anchor="middle" class="xs">版本控制 · 分支管理</text>
    <rect x="1300" y="1282" width="240" height="56" rx="10" fill="#F3F7F4" stroke="#CDD1C8"/>
    <text x="1420" y="1306" text-anchor="middle" class="bn">start-navigation.cmd</text>
    <text x="1420" y="1326" text-anchor="middle" class="xs">一鍵啟動 Valhalla + 後端</text>
  </g>

  <!-- Arrows -->
  <path class="ln" d="M785,160 V248"/>
  <path class="ln" d="M635,130 H220 V248"/>
  <path class="ln" d="M360,405 H428"/>
  <text x="395" y="396" text-anchor="middle" class="lb">進入</text>

  <path class="ln" d="M220,560 V598"/>
  <path class="ln" d="M480,560 V580 H330 V598"/>
  <path class="ln" d="M635,560 V598"/>
  <path class="ln" d="M985,560 V598"/>

  <path class="ln" d="M1140,405 H1228"/>
  <path class="ln" d="M1140,660 H1228"/>

  <path class="ln" d="M260,720 V798"/>
  <text x="272" y="780" class="lb">fetch · REST / JSON（Bearer Token）</text>
  <path class="ln" d="M985,720 V798"/>
  <text x="997" y="780" class="lb">Google 圖磚請求</text>

  <path class="dl" d="M800,1010 V1038"/>
</svg>
