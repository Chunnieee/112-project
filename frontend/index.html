/* ---------------- 詳情頁：可上拉的底部面板 ---------------- */
const isDetailView = () => DETAIL_TABS.some(([v]) => v === state.view);
function sheetHeights() {
  const H = $('.layout').clientHeight || window.innerHeight - 64;
  return { peek: 236, half: Math.round(H * 0.5), full: H - 14 };
}
function applySheet() {
  /* 詳情頁改為右側欄，不再使用可上拉面板；保留函式供既有呼叫 */
  const panel = $('#insightPanel'); panel.style.removeProperty('height'); delete panel.dataset.sheet; return;
  const h = sheetHeights(), target = px ?? h[state.sheet] ?? h.half;
  panel.style.height = `${Math.round(target)}px`;
  panel.dataset.sheet = state.sheet;
}
function mapPadding() {
  /* 手機版地圖較矮：右側留給指北針／定位按鈕，安全總覽上方留給圖層卡 */
  if (isMobile()) return { top: state.view === 'safety' && route() ? 120 : 40, bottom: 36, left: 28, right: 72 };
  if (!isDetailView()) return { top: 130, bottom: 110, left: 90, right: 90 };
  return { top: 90, bottom: state.view === 'safety' ? 170 : 70, left: ['risk', 'safety'].includes(state.view) ? 270 : 80, right: 80 };
}
(() => {
  const panel = $('#insightPanel');
  let drag = null;
  panel.addEventListener('pointerdown', e => {
    if (!isDetailView() || !e.target.closest('.sheet-grip')) return;
    if (e.target.closest('button, a, input, label')) return;
    drag = { y: e.clientY, h: panel.offsetHeight, moved: false };
    panel.classList.add('dragging'); panel.setPointerCapture(e.pointerId);
  });
  panel.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y; if (Math.abs(dy) > 4) drag.moved = true;
    const h = sheetHeights(); applySheet(Math.max(h.peek - 40, Math.min(h.full, drag.h - dy)));
  });
  const end = e => {
    if (!drag) return;
    panel.classList.remove('dragging');
    const h = sheetHeights(), cur = panel.offsetHeight;
    if (!drag.moved) state.sheet = state.sheet === 'full' ? 'half' : state.sheet === 'half' ? 'full' : 'half';
    else state.sheet = Object.entries(h).sort((a, b) => Math.abs(a[1] - cur) - Math.abs(b[1] - cur))[0][0];
    drag = null; applySheet(); setTimeout(fitRoute, 300);
  };
  panel.addEventListener('pointerup', end); panel.addEventListener('pointercancel', end);
  panel.addEventListener('keydown', e => {
    if (!e.target.closest('.sheet-grip') || !['Enter', ' ', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const order = ['peek', 'half', 'full'], i = order.indexOf(state.sheet);
    state.sheet = e.key === 'ArrowDown' ? order[Math.max(0, i - 1)] : e.key === 'ArrowUp' ? order[Math.min(2, i + 1)] : state.sheet === 'full' ? 'half' : 'full';
    applySheet(); setTimeout(fitRoute, 300);
  });
  window.addEventListener('resize', () => applySheet());
})();

async function chooseAndDrive() {
  const r = route(); if (!r) return;
  const row = planRow(r);
  if (state.plan && row && state.diversion) {
    try {
      state.plan = await api('/api/navigation/choice', { method: 'POST', body: { participantId: state.participant, planId: state.plan.planId, routeKey: row.key } });
      toast(`已記錄選擇路線 ${r.id}，開始導航`);
    } catch (e) { toast(`選擇沒有記錄成功（${e.message}），仍開始導航`); if (/到期/.test(e.message)) analyzeRoutes(); }
  } else toast(state.analyzing ? `分析尚未完成，這次選擇不計入分流；開始導航路線 ${r.id}` : `開始導航：路線 ${r.id}`);
  state.step = 0; setView('drive');
}

function riskPanel() {
  const r = route(); if (!r) return needRoute('03 / RISK', '請先查詢路線');
  const e = r.eta, row = planRow(r), car = state.mode === 'car', pts = state.points[row?.key];
  const hs = pts && typeof pts === 'object' && !pts.error ? pts.accidentHotspots : null;
  const line = (label, value, tone = '', sub = '') => `<div class="info-row"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><strong class="${tone}">${value}</strong></div>`;
  const cl = congestionLevel(r), al = accidentLevel(row);

  /* 時間風險：各交通方式都固定列出同樣六項，沒有資料就直接標示 */
  const tt = car && e.source === 'TomTom', tdx = car && !tt && e.riskStatus !== 'unavailable';
  const noLive = !car ? '步行與機車目前沒有路況資料' : !tt && !tdx ? '路況服務無法使用' : '';
  const events = tt ? (e.congestion || []).filter(c => c.category && c.category !== 'JAM').length : tdx ? e.incidents.length : null;
  let time = line('預估時間', `${fmtMin(r.minutes)} 分鐘`, '', `${fmtKm(r.distanceKm)} 公里${tt ? ' · 依即時路況' : !car ? '' : tdx ? '' : ' · 路網估算'}`)
    + line('最差 10% 行程時間', num(e.worst10) ? `${fmtMin(e.worst10)} 分鐘` : tdx ? `樣本不足（${e.sampleCount} 筆）` : '無資料', num(e.worst10) && e.worst10 - r.minutes > 5 ? 'warn' : '', tdx ? '同星期、同時段的歷史分布' : tt ? 'TomTom 不提供歷史分布' : noLive)
    + line('行程穩定度／信心', tdx ? `${esc(e.stability || '–')} / ${esc(e.confidence || '–')}` : '– / –', '', tdx ? '' : tt ? '需要累積歷史樣本' : '')
    + line('即時路況延誤', tt ? (e.delay >= 1 ? `+${fmtMin(e.delay)} 分鐘` : '順暢') : tdx ? (e.delay > 0 ? `+${fmtMin(e.delay)} 分鐘` : '無延誤資料') : '無資料', e.delay > 3 ? 'warn' : tt && e.delay < 1 ? 'good' : '', tt ? 'TomTom 即時路況' : '')
    + line('即時資料覆蓋', tt ? '全線' : tdx && num(e.liveCoverage) ? `${(e.liveCoverage * 100).toFixed(0)}%` : '0%', '', tt ? 'TomTom 路況涵蓋整條路線' : '')
    + line('事件／施工', events == null ? '無資料' : `${events} 筆`, events ? 'warn' : '', tt ? '沿線回報的施工、封路等事件' : '');
  if (tt) time += line('平常此時', num(e.historic) ? `${fmtMin(e.historic)} 分鐘` : '無資料', num(e.historic) && r.minutes - e.historic > 5 ? 'warn' : '', '同一時段的歷史路況')
    + line('不塞車時', num(e.freeFlow) ? `${fmtMin(e.freeFlow)} 分鐘` : '無資料', '', '道路完全順暢時')
    + line('擁堵風險', cl ? LEVEL_TEXT[cl.key] : '無資料', cl ? LEVEL_TONE[cl.key] : '', cl ? `比不塞車多 ${Math.max(0, Math.round((cl.ratio - 1) * 100))}%` : '');

  const cong = car ? (e.congestion || []) : [];
  const congBlock = !car ? '' : `<details class="info-block" data-block="cong" ${state.closedBlocks?.cong ? '' : 'open'}><summary><h3>${icon('car')}擁堵路段<small>${e.source === 'TomTom' ? 'TomTom 即時' : '即時路況'}</small></h3></summary>${cong.length
    ? cong.map((c, i) => `<button type="button" class="info-item" data-focus="cong:${i}"><span class="info-dot cong m${c.magnitude ?? 0}"></span><span><strong>${c.street ? `${esc(c.street)} · ` : ''}${CONG_CAT[c.category] || '車多'}${c.delayMin >= 0.5 ? ` · 延誤 ${fmtMin(c.delayMin)} 分` : ''}</strong><small>約 ${fmtDist(c.lengthM)}${num(c.speedKmh) ? ` · 時速約 ${Math.round(c.speedKmh)} km` : ''}</small></span>${icon('pin')}</button>`).join('')
    : `<p class="info-empty">${e.source === 'TomTom' ? '目前沿線沒有回報的壅塞路段。' : '沒有路段層級的即時路況資料。'}</p>`}</details>`;

  const s = row?.safety;
  let accBody;
  if (!s) accBody = `<p class="info-empty">${state.analyzing ? '正在比對沿線事故資料…' : esc(state.analyzeError || '尚未分析')}</p>`;
  else {
    const spots = hs?.hotspots || [];
    const range = s.dateRange ? `${esc(s.dateRange.from || '')} ～ ${esc(s.dateRange.to || '')} 的歷史資料` : '';
    accBody = line('沿線事故熱點', pts === 'loading' ? '計算中' : hs ? (spots.length ? `經過 ${spots.length} 段` : '沒有集中路段') : '–', spots.length ? 'warn' : hs ? 'good' : '', range)
      + line('事故風險', al ? LEVEL_TEXT[al.key] : '–', al ? LEVEL_TONE[al.key] : '', al ? `事故指標 ${al.score.toFixed(0)} / 100（越高越安全）` : '');
    accBody += pts === 'loading' ? '<p class="info-empty">正在找出事故最密集的路段…</p>'
      : pts?.error ? `<p class="info-empty">事故熱點暫時無法取得：${esc(pts.error)}</p>`
      : spots.length ? `<div class="info-sub">會經過的事故熱點<small>點選可在地圖上定位</small></div>` + spots.map((h, i) => { const road = roadAt(r, (h.fromM + h.toM) / 2); return `<button type="button" class="info-item" data-focus="hot:${i}"><span class="info-dot hot"></span><span><strong>${road ? esc(road) : `事故熱點 ${i + 1}`}</strong><small>距起點 ${(h.fromM / 1000).toFixed(1)}–${(h.toM / 1000).toFixed(1)} 公里</small></span>${icon('pin')}</button>`; }).join('')
      : hs ? '<p class="info-empty">沿線事故分布平均，沒有特別密集的路段。</p>' : '';
  }
  const accBlock = `<details class="info-block" data-block="acc" ${state.closedBlocks?.acc ? '' : 'open'}><summary><h3>${icon('alert')}歷史事故<small>警政署 A1／A2</small></h3></summary>${accBody}</details>`;

  return panelHeader('03 / RISK', '風險分析', '') +
    `<details class="info-block" data-block="time" ${state.closedBlocks?.time ? '' : 'open'}><summary><h3>${icon('clock')}時間風險<small>ETA 穩定度</small></h3></summary>${time}</details>${congBlock}${accBlock}
    <p class="route-footnote">點選路段可在地圖上定位。事故資料為歷史紀錄，不代表即時狀況。</p>`;
}

/* 路燈詳情：把沿線路燈依「距起點位置」分段計數（每段 0.5 或 1 公里），找出比較暗的路段。只用前端已拿到的點位計算 */

    `<div class="info-sub">${state.mode === 'walk' ? '沿線便利商店' : '路線 150 公尺內的便利商店'}<small>依離路線距離排序</small></div>

    ${limit < stores.length ? `<button type="button" class="button ghost sm full" data-action="sd-more">再顯示 ${Math.min(30, stores.length - limit)} 間</button>` : ''}

}

/* 沿線事故明細表（安全分頁「詳細資料」）：依離路線距離排序，先列 40 筆，可再載入更多 */
const accFeatures = pts => (pts && typeof pts === 'object' && !pts.error ? pts.accidents?.features || [] : []);

    ${limit < list.length ? `<button type="button" class="button ghost sm full" data-action="acc-more">再顯示 ${Math.min(40, list.length - limit)} 筆</button>` : ''}

function focusAccident(i) {

  riskPopup?.remove();

    .setHTML(`<strong>${esc(p.date || '')} ${p.fatal ? '死亡事故' : '受傷事故'}</strong><br>${p.location ? esc(p.location) + '<br>' : ''}${esc(p.severity || '')}${p.involved ? `<br>涉入：${esc(p.involved)}` : ''}${num(p.distanceMeters) ? `<br><span style="opacity:.7">距路線約 ${p.distanceMeters} 公尺</span>` : ''}`).addTo(map);

const pad = n => String(n).padStart(2, '0');
const toHM = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
/* ---------------- 最佳出發時間 ---------------- */
const DEP_BUFFERS = [0, 5, 10, 15, 20, 30];
const two = n => String(n).padStart(2, '0');

/* 時段標籤（台灣上下班尖峰的一般認知，僅作為說明用的分類，不影響計算） */

  if ((m >= 390 && m < 450) || (m >= 540 && m < 600) || (m >= 990 && m < 1050) || (m >= 1140 && m < 1200)) return '接近高峰';

function depState() {

function departurePanel() {

  const form = `<div class="dep-form">

    `<p class="hint" style="margin-top:12px">${icon('info')}${d.mode === 'car' ? `以目前檢視的路線 ${r.id} 計算：汽車會用 TomTom 依各時段的預測路況計算這條路線的車程，一次約比較 8 個時段。` : `以目前檢視的路線 ${r.id} 計算：步行與機車沒有路況預測，時間以路網估算，主要幫你算出最晚何時要出門。`}</p>`;

  const summary = rec ? `<section class="dep-result">
      <span class="dep-kicker">建議出發時間</span>
      <strong class="dep-window">${win}</strong>
      <div class="dep-stats">
        <div><small>預估${car ? '車程' : '時間'}</small><b>${fmtMin(rec.minutes)} 分</b></div>
        <div><small>預估抵達</small><b>${clock(rec.arrive)}</b></div>
        <div><small>壅塞程度</small><b>${tt && level ? level : '無資料'}</b></div>

      </div>
      <span class="dep-source">以${esc(d.basis || `路線 ${r.id}`)}計算 · ${tt ? 'TomTom 時段路況預測' : car ? '路網估算（路況服務無法使用）' : '路網估算'}${tt ? ` · ${trafficPeriod(rec.start)}` : ''}</span>
    </section>` : !ok.length ? '' : `<section class="dep-result late"><span class="dep-kicker">無法準時抵達</span><strong class="dep-window" style="font-size:22px">所有時段都會晚到</strong>
      <p class="dep-late-note">${ok.length ? `最早可用的選擇是 ${hhmm(ok[0].start)} 出發，約 ${clock(ok[0].arrive)} 抵達，比目標晚 ${Math.max(1, Math.round((ok[0].arrive - target) / 60000))} 分鐘。` : ''}請把最晚抵達時間往後調，或減少提前的緩衝。</p></section>`;

  const why = rec ? `<section class="dep-why"><h3>為什麼推薦這個時間？</h3><ul>
      <li>系統先排除無法在 ${clock(target)} 前抵達的選項，再找出${car ? '車程' : '時間'}接近最短的候選，最後從中選擇較晚出發的一個，避免為了少塞一點而過早出門。</li>

      ${tt && inc != null ? `<li>推薦時段因交通狀況約增加 ${fmtMin(inc)} 分鐘車程，目前判定為「${trafficPeriod(rec.start)}／壅塞${level || '–'}」。</li>` : ''}
      ${slack != null ? `<li>推薦方案預估仍有約 ${Math.max(0, slack)} 分鐘額外餘裕。</li>` : ''}
      ${skipped ? `<li>有 ${skipped} 個時段無法取得${esc(d.basis || '這條路線')}的預測，已略過、不列入推薦。</li>` : ''}
      ${!tt ? `<li>${car ? '路況預測暫時無法使用，' : '步行與機車沒有路況預測，'}各時段${car ? '車程' : '時間'}相同，所以推薦的是最晚、仍能準時的出發時間。</li>` : ''}
    </ul></section>` : '';

  const rows = list.map(x => {
    if (x.failed) return `<div class="dep-slot failed"><div class="dep-slot-main"><strong>${hhmm(x.start)} 出發</strong>
        <span>${esc(x.failed)}</span><span class="dep-tag bad">已略過</span></div></div>`;
    const late = x.arrive > target, lateMin = Math.round((x.arrive - target) / 60000);
    const lv = jamLevel(x.minutes, x.freeFlow), add = num(x.freeFlow) ? Math.max(0, x.minutes - x.freeFlow) : null;
    return `<div class="dep-slot ${x === rec ? 'rec' : ''} ${late ? 'late' : ''}">
      <div class="dep-slot-main"><strong>${hhmm(x.start)} 出發${x === rec ? ' <span class="dep-badge">推薦</span>' : ''}</strong>
        <span>${fmtMin(x.minutes)} 分 → ${clock(x.arrive)} 抵達</span>
        <span class="dep-tag ${late ? 'bad' : ''}">${late ? `會晚到約 ${Math.max(1, lateMin)} 分` : tt ? `${trafficPeriod(x.start)} · 壅塞 ${lv || '–'}` : '可準時抵達'}</span></div>
      ${tt && add != null ? `<span class="dep-slot-add">交通增加約 ${fmtMin(add)} 分</span>` : ''}
    </div>`;
  }).join('');

  return panelHeader('05 / DEPARTURE', '最佳出發時間', '輸入想抵達的時間，系統比較不同出發時段的車程。') + form +
    (d.error ? `<p class="hint" style="border-color:var(--high-line);margin-top:12px">${esc(d.error)}</p>` : '') +
    summary + why +

    <p class="dep-method">推薦方式：先排除會遲到的時間，再找${car ? '車程' : '時間'}接近最短的候選，最後選擇其中較晚出發的時段。因此不是「越早越好」。</p>`;
}

/* 兩條路線形狀相同的比例：cand 的取樣點有多少落在 ref 路線 40 公尺內（用格網加速） */
function routeOverlap(ref, cand) {
  const lat0 = ref[0][1], kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540, cell = 60;
  const key = (x, y) => `${Math.floor(x / cell)},${Math.floor(y / cell)}`;
  const grid = new Map();
  for (let i = 0; i < ref.length; i++) {
    const a = ref[i], b = ref[i + 1] || a;
    const n = Math.max(1, Math.ceil(Math.hypot((b[0] - a[0]) * kx, (b[1] - a[1]) * ky) / 20));
    for (let k = 0; k <= n; k++) {
      const x = (a[0] + (b[0] - a[0]) * k / n) * kx, y = (a[1] + (b[1] - a[1]) * k / n) * ky, g = key(x, y);
      if (!grid.has(g)) grid.set(g, []); grid.get(g).push([x, y]);
    }
  }
  const step = Math.max(1, Math.floor(cand.length / 150));
  let total = 0, hit = 0;
  for (let i = 0; i < cand.length; i += step) {
    total++;
    const x = cand[i][0] * kx, y = cand[i][1] * ky, cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    let ok = false;
    for (let dx = -1; dx <= 1 && !ok; dx++) for (let dy = -1; dy <= 1 && !ok; dy++)
      ok = (grid.get(`${cx + dx},${cy + dy}`) || []).some(([px, py]) => Math.hypot(px - x, py - y) <= 40);
    if (ok) hit++;
  }
  return total ? hit / total : 0;
}
const SAME_ROUTE = 0.8;
/* 最佳出發時間屬於哪一條路線：交通方式＋路線代號＋形狀（換路線或重新規劃就重算） */
const depRouteKey = () => { const r = route(); return r ? `${state.mode}|${r.id}|${r.coords.length}|${r.coords[0]}|${r.coords.at(-1)}` : ''; };

async function calcDepartures() {
  const d = depState();
  if (d.busy || !state.startCoords || !state.endCoords) return;
  const deadline = new Date(d.deadline);
  if (Number.isNaN(deadline.getTime())) { toast('請選擇希望最晚抵達的時間'); return; }
  const target = deadline.getTime() - d.buffer * 60000, now = Date.now();
  if (target <= now + 60000) { d.error = '抵達時間（扣除緩衝後）已經過了，請選擇之後的時間。'; d.results = []; renderPanel(); return; }
  Object.assign(d, { busy: true, error: null, results: [], target, done: 0, total: 0, source: null, forRoute: depRouteKey(), basis: null }); renderPanel();
  try {
    /* 一律以目前檢視的路線計算 */
    const mode = d.mode, ref = route(), base = ref?.minutes ?? null;
    if (!ref || !num(base)) throw Error('無法取得這段路線的時間');
    d.basis = `路線 ${ref.id}`;
    const step = 15 * 60000, count = mode === 'car' ? 8 : 5;
    let t = Math.floor((target - base * 60000 + 10 * 60000) / 300000) * 300000;
    const slots = [];
    while (slots.length < count && t >= now + 60000) { slots.push(t); t -= step; }
    if (!slots.length) slots.push(Math.ceil((now + 120000) / 60000) * 60000);
    slots.reverse(); d.total = slots.length; renderPanel();
    for (const start of slots) {
      if (mode !== 'car') {
        /* 步行與機車沒有時段路況：每個時段都用同一條路線的時間 */
        d.results.push({ start, minutes: base, freeFlow: null, arrive: start + base * 60000, source: 'network' });
      } else {
        /* 汽車：TomTom 依出發時間預測；只採用與這條路線形狀相同的結果，失敗或找不到同一條就標示略過 */
        let row = { start, minutes: null, freeFlow: null, arrive: null, source: null, failed: '' };
        try {
          const rs = normalizeRoutes(await fetchRoutes(state.startCoords, state.endCoords, 'car', localISO(start), { safety: false }));
          const match = rs.map(x => ({ x, o: routeOverlap(ref.coords, x.coords) })).sort((a, b) => b.o - a.o)[0];
          if (!match) row.failed = '沒有回傳路線';
          else if (match.x.eta.source !== 'TomTom') row.failed = '路況預測暫時無法使用';
          else if (match.o < SAME_ROUTE) row.failed = `這個時段沒有預測到${d.basis}`;
          else row = { start, minutes: match.x.minutes, freeFlow: match.x.eta.freeFlow, arrive: start + match.x.minutes * 60000, source: 'TomTom', failed: '' };
        } catch (e) { row.failed = '預測失敗'; console.warn('[departure]', e.message); }
        if (row.source === 'TomTom') d.source = 'TomTom';
        d.results.push(row);
      }
      d.done++; if (state.view === 'departure') renderPanel();
    }
    if (d.results.every(x => x.failed)) d.error = '所有時段的路況預測都無法取得，請稍後再試。';
  } catch (e) { d.error = e.message; }
  finally { d.busy = false; if (state.view === 'departure') renderPanel(); }
}

    </button>`;
  }).join('');
  return head + effect + `<div class="div-section-head"><h3>各路線分配</h3><small>點選路線可在地圖上查看</small></div><div class="div-routes">${cards}</div>

}

function speak(text) {

  synth.speak(u);

  if (b.dataset.favDel) { const i = Number(b.dataset.favDel), f = favs[i]; favs = favs.filter((_, n) => n !== i); saveFavs(favs); renderFavs(); renderPanel(); if (f) toast(`已移除「${f.name}」`); return; }
  if (b.dataset.action === 'acc-table') { e.preventDefault(); e.stopPropagation(); state.accTable = !state.accTable; state.accLimit = 40; if (state.accTable) (state.closedBlocks ||= {}).safehot = false; renderPanel(); return; }
  if (b.dataset.action === 'acc-more') { state.accLimit = (state.accLimit || 40) + 40; renderPanel(); return; }
  if (b.dataset.inspectRisk) { setRoute(Number(b.dataset.inspectRisk)); setView('risk'); return; }
  if (b.dataset.inspectSafety) { setRoute(Number(b.dataset.inspectSafety)); state.riskFilter = 'all'; setView('safety'); return; }
  if (b.dataset.route) { setRoute(Number(b.dataset.route)); return; }
  if (b.dataset.mode) { syncFormInputs(); if (state.mode !== b.dataset.mode) { state.mode = b.dataset.mode; state.routes = []; state.plan = null; state.departures = null; } renderAll(); return; }
  if (b.dataset.riskfilter) { state.riskFilter = b.dataset.riskfilter; renderAll(); return; }
  if (b.id === 'diversionSwitch') { state.diversion = !state.diversion; analyzeRoutes(); return; }
  switch (b.dataset.action) {
    case 'pick-end': syncFormInputs(); state.pickPoint = 'destination'; toast('請在上方地圖點選目的地'); break;
    case 'swap-points': { syncFormInputs(); [state.origin, state.destination] = [state.destination, state.origin]; [state.startCoords, state.endCoords] = [state.endCoords, state.startCoords]; [state.startName, state.endName] = [state.endName, state.startName]; renderPanel(); renderMarkers(); break; }
    case 'voice-dest': startVoiceSearch(); break;
    case 'gps-start': {
      syncFormInputs();
      if (!navigator.geolocation) { toast('瀏覽器不支援定位'); break; }
      toast('正在取得目前位置…');
      const typedBefore = state.origin;
      navigator.geolocation.getCurrentPosition(pos => {
        /* 定位結果較晚回來時，若使用者已自行輸入起點，就不要覆蓋 */
        syncFormInputs(); if (state.origin !== typedBefore) return;
        state.startCoords = [pos.coords.longitude, pos.coords.latitude]; state.startName = state.origin = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        renderPanel(); renderMarkers(); map.flyTo({ center: state.startCoords, zoom: 15 }); toast('已取得目前位置');
      }, err => toast('無法取得位置：' + err.message), { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 });
      break;
    }
    case 'safety-help': state.safetyHelp = !state.safetyHelp; renderPanel(); break;
    case 'safety-detail': state.safetyDetail = b.dataset.sd; state.sdLimit = 0; state.accLimit = 40; renderAll(); $('#insightPanel .panel-body')?.scrollTo(0, 0); fitRoute(); break;
    case 'safety-detail-close': state.safetyDetail = null; riskPopup?.remove(); riskPopup = null; renderAll(); fitRoute(); break;
    case 'sd-more': state.sdLimit = (state.sdLimit || 30) + 30; renderPanel(); break;
    case 'fixed-new': openPick({ list: 'fixed', id: 'new', label: '' }); break;
    case 'saved-new': openPick({ list: 'saved' }); break;
    case 'pick-cancel': state.pick = null; closeSuggest(); renderPanel(); break;
    case 'fav-current': addFav({ name: state.endName, coords: state.endCoords }); renderPanel(); break;
    case 'reanalyze': analyzeRoutes(); break;
    case 'calc-departure': calcDepartures(); break;
    case 'choose-route': chooseRoute(); break;
    case 'choose-drive': chooseAndDrive(); break;
    case 'toggle-drive': toggleDriving(); break;
    case 'next-step': nextStep(); break;
    case 'focus-drive': setFocus(true); break;
    case 'end-drive': stopDriving(); state.step = 0; setFocus(false); setView('compare'); break;
  }
});

const loadFavs = () => { try { const v = JSON.parse(localStorage.getItem(favKey()) || '[]'); return Array.isArray(v) ? v.filter(f => f && f.name) : []; } catch { return []; } };
const saveFavs = list => { try { localStorage.setItem(favKey(), JSON.stringify(list.slice(0, FAV_MAX))); } catch { toast('瀏覽器無法儲存收藏地點'); } };

const loadFixed = () => { try { const v = JSON.parse(localStorage.getItem(fixedKey()) || '{}'); return v && typeof v === 'object' ? v : {}; } catch { return {}; } };

const saveFixed = () => { try { localStorage.setItem(fixedKey(), JSON.stringify(fixed)); } catch { toast('瀏覽器無法儲存常用地點'); } };
const fixedList = () => [...FIXED_BASE.map(([id, label, ic]) => ({ id, label, ic, ...(fixed[id] || {}) })), ...(fixed.extra || []).map(x => ({ ...x, ic: 'pin' }))];

const pickBox = (title, withLabel) => `<div class="m-pick"><div class="m-pick-head"><strong>${title}</strong><button type="button" class="link" data-action="pick-cancel">取消</button></div>

function savedPanel() {

    ${canSaveCurrent && !p ? `<button type="button" class="fav-current" data-action="fav-current">${icon('star')}<span>收藏目前目的地<small>${esc(state.endName)}</small></span></button>` : ''}
    ${p ? pickBox('新增收藏地點', false) : ''}
    <div class="m-place-list">${rows || '<p class="fav-empty">還沒有收藏地點。按下方按鈕搜尋並加入。</p>'}</div>
    ${p || favs.length >= FAV_MAX ? '' : `<button type="button" class="button secondary full" data-action="saved-new">${icon('plus')}新增收藏地點</button>`}

function openPick(pick) { state.pick = pick; renderPanel(); setTimeout(() => (pick.id === 'new' ? $('#pickLabel') : $('#placePick'))?.focus(), 40); }
function finishPick(place) {
  const p = state.pick; closeSuggest(); if (!p) return;

  else if (p.id.startsWith('x')) fixed.extra = (fixed.extra || []).map(x => x.id === p.id ? { ...x, name, coords: place.coords } : x);
  else fixed[p.id] = { name, coords: place.coords };
  saveFixed(); state.pick = null; renderPanel(); toast(`已設定「${label}」：${name}`);

/* ---------------- 起終點自動完成：下拉建議 + 地圖編號圖釘 ---------------- */
const RECENT_KEY = 'sf.recentPlaces';
const loadRecents = () => { try { const v = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(v) ? v.filter(x => x?.name).slice(0, 6) : []; } catch { return []; } };
const pushRecent = p => { if (!p?.coords) return; try { localStorage.setItem(RECENT_KEY, JSON.stringify([{ name: p.name, sub: p.sub || '', coords: p.coords }, ...loadRecents().filter(x => x.name !== p.name)].slice(0, 6))); } catch {} };
const sugg = { field: null, items: [], active: -1, timer: null, seq: 0, loading: false, error: null, remote: [], query: '', pins: [], cache: new Map() };
const nearPoint = () => state.myLocation?.coords || (() => { const c = map.getCenter(); return [c.lng, c.lat]; })();
const distKm = (a, b) => { const R = 6371, t = x => x * Math.PI / 180, dLat = t(b[1] - a[1]), dLon = t(b[0] - a[0]); const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a[1])) * Math.cos(t(b[1])) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const fmtAway = c => { if (!c) return ''; const d = distKm(nearPoint(), c); return d < 1 ? `${Math.round(d * 1000)} 公尺` : `${d < 10 ? d.toFixed(1) : Math.round(d)} 公里`; };
const highlight = (text, q) => { const t = esc(text); if (!q) return t; const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? t : `${esc(text.slice(0, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>${esc(text.slice(i + q.length))}`; };
const KIND_ICON = { gps: 'locate', fav: 'star', recent: 'clock', place: 'pin' };

function localItems(field, q) {
  const ql = q.toLowerCase(), items = [];
  if ((field === 'origin' || field === 'placePick') && !q) items.push({ kind: 'gps', name: '目前位置', sub: state.myLocation ? '使用剛才的定位結果' : '使用裝置定位' });
  for (const f of favs) if (!q || f.name.toLowerCase().includes(ql)) items.push({ kind: 'fav', name: f.name, sub: f.coords ? '收藏地點' : '收藏地點 · 選取後再確認位置', coords: f.coords || null });
  for (const r of loadRecents()) if ((!q || r.name.toLowerCase().includes(ql)) && !items.some(x => x.name === r.name)) items.push({ kind: 'recent', name: r.name, sub: r.sub || '最近搜尋', coords: r.coords });
  return q ? items.slice(0, 3) : items.slice(0, 7);
}

function buildItems() {
  const input = $('#' + sugg.field); if (!input) return;
  const q = input.value.trim();
  const local = localItems(sugg.field, q);
  const remote = sugg.query === q ? sugg.remote.filter(r => !local.some(l => l.name === r.name)) : [];
  sugg.items = [...local, ...remote];
  if (sugg.active >= sugg.items.length) sugg.active = sugg.items.length - 1;
}

function renderSuggest() {
  const input = sugg.field && $('#' + sugg.field);
  document.querySelectorAll('.suggest').forEach(el => { if (!input || !el.parentElement.contains(input)) el.remove(); });
  if (!input) return;
  buildItems();
  const q = input.value.trim();
  let box = input.closest('.field').querySelector('.suggest');
  if (!box) { box = document.createElement('div'); box.className = 'suggest'; box.id = `${sugg.field}Suggest`; box.setAttribute('role', 'listbox'); input.closest('.field').appendChild(box); }
  let n = 0;
  const rows = sugg.items.map((it, i) => {
    const num = it.kind === 'place' ? ++n : null;
    const away = it.coords ? fmtAway(it.coords) : '';
    return `<div class="suggest-item ${i === sugg.active ? 'active' : ''}" role="option" id="sugg-${i}" data-sugg="${i}" aria-selected="${i === sugg.active}">
      <span class="suggest-icon ${it.kind}">${num ? `<b>${num}</b>` : icon(KIND_ICON[it.kind])}</span>
      <span class="suggest-text"><strong>${highlight(it.name, q)}</strong>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span>
      ${away ? `<span class="suggest-away">${away}</span>` : ''}</div>`;
  }).join('');
  const status = sugg.loading && q ? '<div class="suggest-status"><span class="suggest-spin"></span>搜尋相關地點中…</div>'
    : sugg.error && q ? `<div class="suggest-status">${esc(sugg.error)}</div>`
    : q && sugg.query === q && !sugg.remote.length ? '<div class="suggest-status">找不到相符的地點，可以換個說法，或直接按「查詢路線」。</div>' : '';
  const head = !q && sugg.items.length ? `<div class="suggest-head">${({ origin: '從哪裡出發？', placePick: '選擇地點' })[sugg.field] || '要去哪裡？'}</div>` : '';
  box.innerHTML = head + rows + status;
  box.hidden = !(rows || status);
  input.setAttribute('aria-expanded', String(!box.hidden));
  input.setAttribute('aria-activedescendant', sugg.active >= 0 ? `sugg-${sugg.active}` : '');
  renderSuggestPins();
}

function clearPins() { sugg.pins.forEach(m => m.remove()); sugg.pins = []; }
function renderSuggestPins(fit = false) {
  clearPins();
  if (!sugg.field) return;
  const places = sugg.items.map((it, i) => ({ it, i })).filter(x => x.it.kind === 'place' && x.it.coords);
  places.forEach(({ it, i }, k) => {
    const el = document.createElement('button'); el.type = 'button';
    el.className = `sugg-pin ${i === sugg.active ? 'active' : ''}`; el.innerHTML = `<span>${k + 1}</span>`; el.title = it.name;
    el.addEventListener('mousedown', e => e.preventDefault());
    el.addEventListener('click', () => selectSuggestion(i));
    el.addEventListener('mouseenter', () => { sugg.active = i; renderSuggest(); });
    sugg.pins.push(new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(it.coords).addTo(map));
  });
  if (fit && places.length) {
    const anchor = places[0].it.coords, b = new maplibregl.LngLatBounds();
    places.filter(p => distKm(anchor, p.it.coords) <= 25).forEach(p => b.extend(p.it.coords));
    const other = sugg.field === 'origin' ? state.endCoords : state.startCoords; if (other) b.extend(other);
    map.fitBounds(b, { padding: { top: 110, bottom: 80, left: 80, right: 80 }, maxZoom: 15.5, duration: 600 });
  }
}

function queueRemote() {
  const input = $('#' + sugg.field); if (!input) return;
  const q = input.value.trim();
  clearTimeout(sugg.timer);
  if (!q) { sugg.remote = []; sugg.query = ''; sugg.loading = false; sugg.error = null; renderSuggest(); return; }
  const near = nearPoint(), key = `${q}|${near.map(v => v.toFixed(2)).join(',')}`;
  if (sugg.cache.has(key)) { sugg.remote = sugg.cache.get(key); sugg.query = q; sugg.loading = false; sugg.error = null; renderSuggest(); renderSuggestPins(true); return; }
  sugg.loading = true; sugg.error = null; renderSuggest();
  sugg.timer = setTimeout(async () => {
    const seq = ++sugg.seq;
    try {
      const data = await api(`/api/place-suggest?${new URLSearchParams({ q, nearLat: near[1], nearLon: near[0], limit: 8 })}`, { timeout: 20000 });
      if (seq !== sugg.seq) return;
      const list = (data.suggestions || []).filter(s => num(Number(s.lat)) && num(Number(s.lon))).map(s => {
        const sub = [s.address && s.address !== s.displayName ? s.address : '', s.city && !(s.address || '').includes(s.city) ? s.city : ''].filter(Boolean).join(' · ');
        return { kind: 'place', name: s.displayName, sub, coords: [Number(s.lon), Number(s.lat)] };
      });
      sugg.cache.set(key, list); sugg.remote = list; sugg.query = q; sugg.loading = false;
      if ($('#' + sugg.field)?.value.trim() === q) { if (sugg.active < 0 && list.length) sugg.active = sugg.items.length ? 0 : -1; renderSuggest(); renderSuggestPins(true); }
    } catch (e) {
      if (seq !== sugg.seq) return;
      sugg.loading = false; sugg.remote = []; sugg.query = q; sugg.error = '地點搜尋暫時無法使用，可以直接按「查詢路線」'; renderSuggest();
    }
  }, 280);
}

function closeSuggest() { clearTimeout(sugg.timer); sugg.seq++; document.querySelectorAll('.suggest').forEach(el => el.remove()); clearPins(); const f = sugg.field && $('#' + sugg.field); f?.setAttribute('aria-expanded', 'false'); sugg.field = null; sugg.items = []; sugg.active = -1; sugg.loading = false; }

function applyPlace(field, place) {
  if (field === 'placePick') { finishPick(place); return; }
  const input = $('#' + field);
  if (field === 'origin') { state.startCoords = place.coords; state.startName = state.origin = place.name; }
  else { state.endCoords = place.coords; state.endName = state.destination = place.name; }
  if (input) input.value = place.name;
  closeSuggest(); renderMarkers();
  $('#sidebarStart').textContent = state.origin || '–'; $('#sidebarEnd').textContent = state.destination || '–';
  if (state.startCoords && state.endCoords) {
    const b = new maplibregl.LngLatBounds(); b.extend(state.startCoords); b.extend(state.endCoords);
    map.fitBounds(b, { padding: { top: 120, bottom: 90, left: 90, right: 90 }, maxZoom: 15.5, duration: 700 });
  } else map.flyTo({ center: place.coords, zoom: Math.max(map.getZoom(), 15), duration: 700 });
  const next = field === 'origin' ? (!state.destination ? '#destination' : null) : (!state.origin ? '#origin' : null);
  setTimeout(() => { if (next) $(next)?.focus(); else $('#planForm button[type=submit]')?.focus(); }, 30);
}

function selectSuggestion(i) {
  const it = sugg.items[i], field = sugg.field; if (!it || !field) return;
  if (it.kind === 'gps') {
    const use = m => applyPlace(field, { name: '目前位置', coords: m.coords });
    if (state.myLocation) { use(state.myLocation); return; }
    if (!navigator.geolocation) { toast('這個瀏覽器不支援定位'); return; }
    toast('正在取得目前位置…');
    navigator.geolocation.getCurrentPosition(pos => {
      state.myLocation = { coords: [pos.coords.longitude, pos.coords.latitude], accuracy: pos.coords.accuracy }; renderMe(); use(state.myLocation);
    }, err => toast(err.code === 1 ? '沒有定位權限，請在瀏覽器網址列旁允許存取位置' : '目前無法取得位置'), { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 });
    return;
  }
  if (!it.coords) { const input = $('#' + field); input.value = it.name; sugg.active = -1; queueRemote(); return; }
  if (it.kind === 'place') pushRecent(it);
  applyPlace(field, it);
}

function openSuggestFor(input) {
  if (sugg.field !== input.id) { closeSuggest(); sugg.field = input.id; }
  sugg.active = -1; renderSuggest();
  if (input.value.trim()) queueRemote();
}

const panel = $('#insightPanel');
const SUGG_FIELDS = ['origin', 'destination', 'placePick'];
panel.addEventListener('focusin', e => { if (SUGG_FIELDS.includes(e.target.id)) openSuggestFor(e.target); });
panel.addEventListener('input', e => {
  const id = e.target.id; if (!SUGG_FIELDS.includes(id)) return;
  if (sugg.field !== id) sugg.field = id;
  sugg.active = -1; queueRemote();
});
panel.addEventListener('keydown', e => {
  if (!SUGG_FIELDS.includes(e.target.id) || sugg.field !== e.target.id) return;
  const n = sugg.items.length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); sugg.active = (sugg.active + 1) % n; renderSuggest(); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); sugg.active = (sugg.active - 1 + n) % n; renderSuggest(); }
  else if (e.key === 'Enter' && n && (sugg.active >= 0 || sugg.items.some(x => x.kind === 'place'))) {
    e.preventDefault(); selectSuggestion(sugg.active >= 0 ? sugg.active : sugg.items.findIndex(x => x.kind === 'place'));
  } else if (e.key === 'Escape') { closeSuggest(); }
});
panel.addEventListener('focusout', e => {
  if (!SUGG_FIELDS.includes(e.target.id)) return;
  setTimeout(() => { const a = document.activeElement; if (!a || !SUGG_FIELDS.includes(a.id)) closeSuggest(); }, 120);
});
panel.addEventListener('mousedown', e => { if (e.target.closest('.suggest')) e.preventDefault(); });
panel.addEventListener('click', e => { const it = e.target.closest('[data-sugg]'); if (it) selectSuggestion(Number(it.dataset.sugg)); });
panel.addEventListener('mouseover', e => { const it = e.target.closest('[data-sugg]'); if (it && Number(it.dataset.sugg) !== sugg.active) { sugg.active = Number(it.dataset.sugg); renderSuggest(); } });

$('#accountFavs').addEventListener('click', () => { $('#accountMenu').hidden = true; $('#accountBtn').setAttribute('aria-expanded', 'false'); setView('saved'); });
renderFavs();
$('#homeMenu').addEventListener('click', () => { $('#menuOverlay').classList.add('show'); $('#menuOverlay').setAttribute('aria-hidden', 'false'); });
$('#menuClose').addEventListener('click', () => { $('#menuOverlay').classList.remove('show'); $('#menuOverlay').setAttribute('aria-hidden', 'true'); });
$('#menuOverlay').addEventListener('click', e => { if (e.target.id === 'menuOverlay') { $('#menuClose').click(); return; } const b = e.target.closest('[data-menu-view]'); if (b) setView(b.dataset.menuView); });
$('#appBack').addEventListener('click', () => state.view === 'safety' && state.safetyDetail ? panel.querySelector('[data-action="safety-detail-close"]')?.click() : setView(({ plan: 'home', compare: 'plan', risk: 'compare', safety: 'compare', departure: 'compare', diversion: 'compare', drive: 'compare' })[state.view] || 'home'));
$('#mapFloatingSummary').addEventListener('click', () => setView(route() ? 'compare' : 'plan'));
/* 手機版：底部導覽列（首頁／常用／收藏）、拖拉把手、導航畫面 */
$('#mTabbar').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]')?.dataset.tab; if (!t) return;
  syncFormInputs(); closeSuggest(); setView(t);
});
(() => {
  const el = $('#insightPanel'); let g = null;
  const mapH = () => $('.map-shell').getBoundingClientRect().height;
  const setH = h => document.body.style.setProperty('--m-map', `${Math.round(Math.max(110, Math.min($('.app').getBoundingClientRect().height * 0.62, h)))}px`);
  const end = () => { if (!g) return; if (!g.moved) { if (mapH() > 170) setH(120); else document.body.style.removeProperty('--m-map'); } g = null; setTimeout(fitRoute, 150); };
  el.addEventListener('pointerdown', e => { if (!e.target.closest('.m-grip')) return; e.preventDefault(); g = { y: e.clientY, h: mapH(), moved: false }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!g) return; const dy = e.clientY - g.y; if (Math.abs(dy) > 4) g.moved = true; if (g.moved) setH(g.h + dy); });
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => { if (e.target.closest('.m-grip') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g = { moved: false }; end(); } });
})();
$('#driveCard').addEventListener('click', () => { if (state.view === 'drive' && route()) nextStep(); });
$('#mVoice').addEventListener('click', () => {
  state.voice = state.voice === false;
  if (!state.voice) window.speechSynthesis?.cancel();
  else { const s = route()?.steps[state.step]; if (s) speak(s.text); }
  renderDriveOverlay(); toast(state.voice ? '已開啟語音播報' : '已關閉語音播報');
});
$('#mLocate').addEventListener('click', locateMe);
$('#mCompass').addEventListener('click', () => { map.easeTo({ bearing: 0, pitch: 0, duration: 300 }); if (route()) setTimeout(fitRoute, 320); });
$('#focusNext').addEventListener('click', nextStep);
$('#focusExit').addEventListener('click', () => { setFocus(false); setView('drive'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.focus) { setFocus(false); setView('drive'); } });

function startVoiceSearch() {
  const Engine = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Engine) { toast('此瀏覽器不支援語音辨識，請手動輸入'); return; }
  try {
    const rec = new Engine(); rec.lang = 'zh-TW'; rec.continuous = false; rec.interimResults = false;
    rec.onresult = e => { const text = e.results?.[0]?.[0]?.transcript?.trim(); if (!text) return; syncFormInputs(); state.destination = text; state.endCoords = null; setView('plan'); setTimeout(() => $('#destination')?.focus(), 50); toast('已填入目的地：' + text); };
    rec.onerror = e => toast('語音輸入未完成：' + e.error);
    rec.start(); toast('請說出目的地…');
  } catch (e) { toast('無法啟動語音辨識：' + e.message); }
}

if ('ResizeObserver' in window) new ResizeObserver(() => map.resize()).observe($('.map-shell'));
setView('home');
api('/api/health', { timeout: 6000 }).then(() => { state.apiOnline = true; }).catch(() => { state.apiOnline = false; }).finally(() => { renderMap(); if (state.view === 'home') renderPanel(); });

</script>
<script>
(function(){
  var S=window.SafeFlowSession, sess=S.get(); if(!sess) return;
  var guest=sess.type==='guest', name=S.displayName();
  var btn=document.getElementById('accountBtn'), menu=document.getElementById('accountMenu');
  btn.classList.toggle('guest',guest);
  document.getElementById('accountAvatar').textContent=guest?'訪':name.trim().charAt(0).toUpperCase();
  document.getElementById('accountName').textContent=name;
  document.getElementById('accountMenuName').textContent=guest?'訪客模式':name;
  document.getElementById('accountMenuSub').textContent=guest?'設定與紀錄只保留在這個瀏覽器':(sess.user&&sess.user.email||'');
  var primary=document.getElementById('accountPrimary');
  primary.textContent=guest?'登入或註冊帳號':'登出';
  primary.addEventListener('click',function(){ if(guest){ S.clear(); location.href=S.WELCOME_PAGE+'#auth'; } else S.logout(); });
  var look=document.getElementById('accountLook');
  function showLook(){ look.textContent='外觀：'+S.APPEARANCES[S.appearance()]; }
  showLook();
  look.addEventListener('click',function(e){ e.stopPropagation(); S.cycleAppearance(); showLook(); });
  document.getElementById('accountIntro').addEventListener('click',function(){ location.href=S.WELCOME_PAGE+'#intro'; });
  function toggle(open){ menu.hidden=!open; btn.setAttribute('aria-expanded',open); }
  btn.addEventListener('click',function(e){ e.stopPropagation(); toggle(menu.hidden); });
  document.addEventListener('click',function(e){ if(!menu.hidden&&!menu.contains(e.target)) toggle(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') toggle(false); });
})();
</script>
