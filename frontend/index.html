<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#070a0f"
  />

  <title>
    RiskNav — Risk-Aware Navigation
  </title>


  <!-- =========================
       MAPLIBRE CSS
  ========================== -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css"
  />


  <!-- =========================
       APP CSS
  ========================== -->
  <link
    rel="stylesheet"
    href="style.css?v=200"
  />
</head>


<body>

  <div class="app-shell">


    <!-- =========================
         MAP
    ========================== -->
    <div
      id="map"
      aria-label="Navigation map"
    ></div>



    <!-- =========================
         MAIN SIDEBAR
    ========================== -->
    <aside
      class="sidebar"
      id="controlPanel"
    >


      <!-- =========================
           BRAND HEADER
      ========================== -->
      <header class="brand-row">

        <div class="brand">

          <div class="brand-icon">
            R
          </div>

          <div>

            <div class="brand-name">
              RiskNav
            </div>

            <div class="brand-subtitle">
              Risk-aware navigation
            </div>

          </div>

        </div>


        <!-- Backend status -->
        <div
          class="online-pill"
          id="backendStatus"
        >

          <span class="online-dot"></span>

          <span id="backendStatusText">
            Connecting
          </span>

        </div>

      </header>



      <!-- =========================
           SEARCH PANEL
      ========================== -->
      <section class="search-panel">

        <div class="input-stack">


          <!-- Start indicator -->
          <div
            class="input-point start-point"
          ></div>


          <!-- Vertical connector -->
          <div
            class="input-line"
          ></div>


          <!-- End indicator -->
          <div
            class="input-point end-point"
          ></div>



          <!-- =========================
               START
          ========================== -->
          <div class="search-field">

            <label for="startInput">
              起點
            </label>


            <div class="field-shell">

              <input
                id="startInput"
                type="text"
                autocomplete="off"
                placeholder="輸入起點"
              />


              <button
                id="startVoiceBtn"
                class="icon-button"
                type="button"
                aria-label="語音輸入起點"
              >
                ◉
              </button>

            </div>

          </div>



          <!-- =========================
               DESTINATION
          ========================== -->
          <div class="search-field">

            <label for="endInput">
              目的地
            </label>


            <div class="field-shell">

              <input
                id="endInput"
                type="text"
                autocomplete="off"
                placeholder="輸入目的地"
              />


              <button
                id="endVoiceBtn"
                class="icon-button"
                type="button"
                aria-label="語音輸入目的地"
              >
                ◉
              </button>

            </div>

          </div>



          <!-- =========================
               SWAP
          ========================== -->
          <button
            id="swapBtn"
            class="swap-button"
            type="button"
            aria-label="交換起終點"
          >
            ⇅
          </button>

        </div>



        <!-- =========================
             PRIMARY ACTIONS
        ========================== -->
        <div class="primary-actions">

          <button
            id="locationBtn"
            class="secondary-button"
            type="button"
          >
            定位
          </button>


                  <!-- SCOOTER_FRONTEND_V1 -->
        <div
          class="transport-switch"
          role="group"
          aria-label="交通工具"
        >
          <button
            id="carTransportBtn"
            class="transport-button active"
            type="button"
            aria-pressed="true"
          >
            <svg
              class="transport-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M5 16h14M6.5 16l1-5h9l1 5M8 11l1.2-3h5.6l1.2 3M7 18.2h.01M17 18.2h.01"
              />
            </svg>
            <span>汽車</span>
          </button>

          <button
            id="scooterTransportBtn"
            class="transport-button"
            type="button"
            aria-pressed="false"
          >
            <svg
              class="transport-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M7 17a2.5 2.5 0 1 0 0 .01M17 17a2.5 2.5 0 1 0 0 .01M9.5 17h4l2-6h-4l-1.5 3H8.5M15.5 11l1-3h2"
              />
            </svg>
            <span>機車</span>
          </button>
        </div>

<button
            id="routeBtn"
            class="primary-button"
            type="button"
          >
            規劃路線 →
          </button>

        </div>

      </section>



      <!-- =========================
           FASTEST / RELIABLE SWITCH
      ========================== -->
      <div
        class="mode-switch"
        aria-label="Route preference"
      >

        <button
          id="fastestModeBtn"
          class="mode-button active"
          type="button"
        >

          <span>
            ⚡
          </span>

          <span>
            Fastest
          </span>

        </button>


        <button
          id="reliableModeBtn"
          class="mode-button"
          type="button"
        >

          <span>
            ◆
          </span>

          <span>
            Reliable
          </span>

        </button>

      </div>



      <!-- =========================
           STATUS
      ========================== -->
      <div
        id="status"
        class="status-message"
        role="status"
        aria-live="polite"
      >
        輸入起點與目的地開始規劃。
      </div>



      <!-- =========================
           RECOMMENDATION
      ========================== -->
      <section
        id="recommendationBox"
      ></section>



      <!-- =========================
           ROUTES
      ========================== -->
      <section class="route-section">

        <div class="section-head">

          <div>

            <div class="section-kicker">
              ROUTES
            </div>

            <h2>
              候選路線
            </h2>

          </div>


          <button
            id="clearBtn"
            class="text-button"
            type="button"
          >
            Clear
          </button>

        </div>


        <div
          id="routeList"
          class="route-list"
        ></div>

      </section>



      <!-- =========================
           ADVANCED MULTIMODAL
      ========================== -->
      <details class="advanced-panel">

        <summary>

          多點 / 多交通工具

          <span>
            Advanced
          </span>

        </summary>


        <div class="advanced-body">


          <!-- Waypoints -->
          <div
            id="waypointList"
          ></div>


          <button
            id="addWaypointBtn"
            class="advanced-action"
            type="button"
          >
            ＋ 新增中途點
          </button>



          <label for="endMode">
            最後一段交通工具
          </label>


          <select
            id="endMode"
          >

            <option value="drive">
              開車
            </option>

            <option value="walk">
              步行
            </option>

            <option value="bus">
              公車
            </option>

            <option value="mrt">
              捷運
            </option>

            <option value="train">
              台鐵
            </option>

            <option value="hsr">
              高鐵
            </option>

          </select>



          <button
            id="multiRouteBtn"
            class="advanced-route-button"
            type="button"
          >
            規劃多段路線
          </button>

        </div>

      </details>



      <!-- =========================
           FOOTER
      ========================== -->
      <footer class="footer-note">

        <span>
          Risk-aware routing research prototype
        </span>

        <span>
          Live + historical evidence
        </span>

      </footer>

    </aside>



    <!-- =========================
         MAP STATUS
    ========================== -->
    <div
      class="map-status"
      id="mapStatus"
    >

      <span class="map-status-dot"></span>

      <span id="mapStatusText">
        Map ready
      </span>

    </div>



    <!-- =========================
         FLOATING ROUTE SUMMARY
    ========================== -->
    <div
      class="floating-summary"
      id="floatingSummary"
      hidden
    >

      <div>

        <span
          class="floating-route"
          id="floatingRoute"
        >
          Route A
        </span>


        <strong
          id="floatingEta"
        >
          — min
        </strong>

      </div>


      <span
        id="floatingMeta"
      >
        — km
      </span>

    </div>



    <!-- =========================
         MAP LOCATION BUTTON
    ========================== -->
    <button
      id="mapLocationBtn"
      class="map-location-button"
      type="button"
      aria-label="我的位置"
    >
      ◎
    </button>



    <!-- =========================
         DETAILS BACKDROP
    ========================== -->
    <div
      class="drawer-backdrop"
      id="drawerBackdrop"
      hidden
    ></div>



    <!-- =========================
         ROUTE DETAILS DRAWER
    ========================== -->
    <aside
      class="details-drawer"
      id="detailsDrawer"
      aria-hidden="true"
    >


      <!-- Drawer header -->
      <header class="drawer-header">

        <div>

          <div class="drawer-kicker">
            ROUTE DETAILS
          </div>


          <h2
            id="drawerTitle"
          >
            Route A
          </h2>

        </div>


        <button
          id="drawerCloseBtn"
          class="drawer-close"
          type="button"
          aria-label="關閉"
        >
          ×
        </button>

      </header>



      <!-- Drawer content -->
      <div
        id="drawerContent"
        class="drawer-content"
      ></div>

    </aside>

  </div>



  <!-- =========================
       APP JS
  ========================== -->
  <script
    type="module"
    src="app.js?v=204"
  ></script>

  <script src="etaTripTracker.js?v=6"></script>
</body>
</html>
