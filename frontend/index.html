<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1412" />
  <title>SafeFlow 智慧導航</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
  <style>
    /* ===== SafeFlow palette =====
   Light「鼠尾草霧灰」 sage-mist paper, forest green, mustard accent
   Dark 「墨綠古金」   ink green-black, antique gold, moss          */
:root{
  color-scheme:light;
  --bg:#ECEDE8; --bg-deep:#DADDD5; --surface:#F8F8F4; --surface-2:#E3E5DE; --surface-3:#D8DCD2;
  --line:#CDD1C8; --line-2:#B7BEB3; --text:#1E2420; --text-2:#3B443E; --muted:#6B736C;
  --primary:#2F6B4F; --primary-strong:#255A41; --primary-soft:#DCE8DF; --on-primary:#F8F8F4; --primary-text:#2F6B4F;
  --accent:#E3B341; --nav-bg:#1C211E; --nav-fg:#9AA39B; --nav-on:#E3B341;
  --low:#3E8257; --low-bg:#DDEBDF; --low-line:#B5D2BC;
  --mid:#B07714; --mid-bg:#F4E8CB; --mid-line:#E2C98C;
  --high:#B5483B; --high-bg:#F4DCD7; --high-line:#E2B3AB;
  --route-a:#2F6B4F; --route-b:#C98A1B; --route-c:#5B7FA6; --route-d:#8A6FA0;
  --pt-light:#C9961E; --route-casing:#1E2420; --scrim:rgba(28,33,30,.55);
  --shadow-rgb:30 36 32; --shadow-k:.45;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1412; --bg-deep:#090C0B; --surface:#18201D; --surface-2:#222C27; --surface-3:#2A3530;
  --line:#2F3B35; --line-2:#3E4B44; --text:#ECE6D6; --text-2:#CFC9B8; --muted:#8E968C;
  --primary:#C2A66B; --primary-strong:#A88D55; --primary-soft:#2A2A20; --on-primary:#17150F; --primary-text:#D4BC86;
  --accent:#C2A66B; --nav-bg:#0B0F0D; --nav-fg:#7F887F; --nav-on:#C2A66B;
  --low:#7FA88A; --low-bg:#1B2A21; --low-line:#34503E;
  --mid:#D1A55A; --mid-bg:#2D2517; --mid-line:#5A4826;
  --high:#C7695B; --high-bg:#2F1A17; --high-line:#5C302A;
  --route-a:#C2A66B; --route-b:#7FA88A; --route-c:#8FA3B8; --route-d:#B48A8A;
  --pt-light:#E0C27A; --route-casing:#060A08; --scrim:rgba(4,6,5,.74);
  --shadow-rgb:0 0 0; --shadow-k:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1412; --bg-deep:#090C0B; --surface:#18201D; --surface-2:#222C27; --surface-3:#2A3530;
    --line:#2F3B35; --line-2:#3E4B44; --text:#ECE6D6; --text-2:#CFC9B8; --muted:#8E968C;
    --primary:#C2A66B; --primary-strong:#A88D55; --primary-soft:#2A2A20; --on-primary:#17150F; --primary-text:#D4BC86;
    --accent:#C2A66B; --nav-bg:#0B0F0D; --nav-fg:#7F887F; --nav-on:#C2A66B;
    --low:#7FA88A; --low-bg:#1B2A21; --low-line:#34503E;
    --mid:#D1A55A; --mid-bg:#2D2517; --mid-line:#5A4826;
    --high:#C7695B; --high-bg:#2F1A17; --high-line:#5C302A;
    --route-a:#C2A66B; --route-b:#7FA88A; --route-c:#8FA3B8; --route-d:#B48A8A;
    --pt-light:#E0C27A; --route-casing:#060A08; --scrim:rgba(4,6,5,.74);
    --shadow-rgb:0 0 0; --shadow-k:1;
  }
}
:root{
  --rail:var(--surface); --card:var(--surface); --card2:var(--surface-2); --line2:var(--line-2); --muted2:var(--muted);
  --blue:var(--primary); --blue2:var(--primary-strong); --green:var(--low); --amber:var(--mid); --red:var(--high);
  --white:var(--text); --lamp:var(--pt-light);
  --shadow:0 18px 55px rgb(var(--shadow-rgb) / calc(.24 * var(--shadow-k)));
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
}

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button,input,select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    svg { display: block; }
    .icon { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; flex-shrink: 0; }
    .app { display: flex; flex-direction: column; height: 100vh; min-height: 620px; }
    .topbar { height: 76px; padding: 0 24px; display:flex; align-items:center; justify-content:space-between; gap: 18px; border-bottom:1px solid var(--line); background:var(--surface); z-index:4; }
    .brand { display:flex; align-items:center; gap:12px; min-width:220px; }
    .brand-mark { display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--line-2); background:var(--surface-3); border-radius:13px; color:var(--blue); }
    .brand-mark svg { width:23px;height:23px; }
    .brand-name { font-size:18px; font-weight:760; letter-spacing:.2px; }
    .brand-sub { color:var(--muted); font-size:11px; margin-top:1px; letter-spacing:.5px; }
    .top-right { display:flex; align-items:center; gap:12px; }
    .demo-pill { font-size:11px; font-weight:650; letter-spacing:1px; color:var(--text-2); padding:7px 10px; border:1px solid var(--line-2); border-radius:100px; background:var(--surface-2); white-space:nowrap; }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 12px color-mix(in srgb,var(--low) 44%,transparent); }
    .top-note { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:12px; white-space:nowrap; }
    .layout { flex:1; display:grid; grid-template-columns:265px minmax(0,1fr) 358px; grid-template-rows:minmax(0,1fr); min-height:0; height:calc(100vh - 76px); }
    .sidebar { background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:22px 14px 16px; overflow-y:auto; }
    .sidebar-heading { color:var(--muted2); text-transform:uppercase; font-weight:750; font-size:11px; letter-spacing:2px; margin:0 12px 12px; }
    .navigation { display:flex; flex-direction:column; gap:5px; }
    .nav-button { width:100%; border:1px solid transparent; border-radius:11px; padding:13px 13px; display:flex; align-items:center; gap:12px; text-align:left; background:transparent; color:var(--text-2); font-size:13px; font-weight:590; transition:.18s ease; }
    .nav-button:hover { background:var(--primary-soft); color:var(--text); }
    .nav-button.active { color:var(--primary-text); background:var(--primary-soft); border-color:var(--line-2); }
    .nav-button.active .nav-icon { color:var(--blue); }
    .nav-icon { display:grid;place-items:center;width:24px; }
    .nav-chevron { margin-left:auto; color:var(--primary); font-size:13px; }
    .sidebar-divider { height:1px; background:var(--line); margin:22px 12px; }
    .sidebar-journey { margin:0 8px; padding:17px 14px; border-radius:15px; background:var(--surface-2); border:1px solid var(--line-2); }
    .eyebrow { font-size:10px; letter-spacing:1.7px; font-weight:750; color:var(--muted); text-transform:uppercase; }
    .journey-places { margin-top:17px; display:flex; gap:12px; }
    .journey-track { display:flex;flex-direction:column;align-items:center;gap:5px; padding:5px 0; }
    .journey-track .dot { display:block;width:10px;height:10px;border:2px solid var(--blue); border-radius:50%; }
    .journey-track .end { border-color:var(--green);background:var(--green); }
    .journey-track .dash { flex:1;border-left:1px dashed var(--line-2);min-height:26px; }
    .journey-values { min-width:0;display:flex;flex-direction:column;gap:19px; flex:1; }
    .place-caption { font-size:11px; color:var(--muted); margin-bottom:3px; }
    .place-name { font-size:13px; color:var(--text); font-weight:660; line-height:1.35; overflow-wrap:anywhere; }
    .sidebar-foot { margin-top:auto; padding:28px 12px 0; color:var(--muted2); font-size:11px; line-height:1.7; }
    .map-shell { position:relative; overflow:hidden; min-height:530px; background:var(--surface); isolation:isolate; }
    .map-canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .map-tint { position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 45%,transparent 5%,color-mix(in srgb,var(--surface) 24%,transparent) 94%); z-index:1; }
    .map-svg { width:100%;height:100%;position:absolute;inset:0; z-index:2; overflow:visible; }
    .map-svg .alternative { fill:none; stroke:var(--muted); stroke-width:4; opacity:.28; stroke-linecap:round;stroke-linejoin:round; cursor:pointer; }
    .map-svg .alternative:hover { stroke:var(--primary);opacity:.6; }
    .map-svg .selected-route-shadow { fill:none; stroke:color-mix(in srgb,var(--primary) 16%,transparent); stroke-width:20; stroke-linecap:round;stroke-linejoin:round; }
    .map-svg .selected-route { fill:none; stroke:var(--primary);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--primary) 30%,transparent)); }
    .map-svg .map-label { font-size:17px;fill:var(--line-2); font-weight:700; letter-spacing:5px; opacity:.65; }
    .map-svg .marker-ring { fill:color-mix(in srgb,var(--surface-3) 80%,transparent);stroke:var(--primary);stroke-width:2; }
    .map-svg .risk-pin { cursor:pointer; }
    .map-svg .risk-pin circle { stroke-width:2; }
    .map-svg .risk-pin text { fill:var(--surface); font-size:16px; font-weight:850;text-anchor:middle;dominant-baseline:middle; }
    .map-header { position:absolute;z-index:3;top:23px;left:23px;right:23px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px; pointer-events:none; }
    .glass { background:color-mix(in srgb,var(--surface) 91%,transparent); border:1px solid var(--line-2); box-shadow:0 14px 36px rgb(var(--shadow-rgb) / calc(0.18 * var(--shadow-k))); backdrop-filter:blur(12px); }
    .map-heading { border-radius:13px;padding:13px 16px;max-width:min(340px,72%); }
    .map-heading strong { display:block;font-size:14px;font-weight:690;line-height:1.4; }
    .map-heading small { display:block;margin-top:5px;color:var(--text-2);font-size:11px;line-height:1.5; }
    .map-actions { display:flex;gap:8px;pointer-events:auto; }
    .round-action { width:39px;height:39px;border-radius:12px;display:grid;place-items:center;color:var(--text-2); }
    .round-action:hover,.round-action.on { color:var(--blue); border-color:var(--line-2);background:var(--primary-soft); }
    .map-legend { position:absolute;z-index:3;bottom:24px;left:24px;display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-radius:12px; pointer-events:none; }
    .legend-item { display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2); }
    .legend-line { width:23px;height:4px;border-radius:10px;background:var(--primary); }
    .legend-muted { background:var(--muted); opacity:.65; }
    .legend-dot { width:8px;height:8px;border-radius:50%;background:var(--amber); }
    .scale-note { position:absolute;bottom:26px;right:24px;z-index:3;color:var(--muted);font-size:10px;letter-spacing:.2px;pointer-events:none; }
    .insight-panel { background:var(--surface); border-left:1px solid var(--line); padding:25px 23px 23px;overflow-y:auto; min-width:0; }
    .panel-heading { margin-bottom:22px; }
    .panel-kicker { color:var(--blue); font-size:11px; font-weight:770;letter-spacing:2px; margin-bottom:10px; }
    .panel-title { font-size:23px;letter-spacing:-.5px;font-weight:750;line-height:1.3;margin:0 0 10px; }
    .panel-desc { color:var(--muted);font-size:12px;line-height:1.8;margin:0; }
    .panel-section { margin-bottom:19px; }
    .section-heading { font-size:12px;font-weight:700;color:var(--primary-text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between; }
    .text-muted { color:var(--muted); }
    .tiny { font-size:11px;line-height:1.65; }
    .surface { background:var(--surface-2); border:1px solid var(--line-2); border-radius:14px; padding:16px; }
    .input-label { display:block; font-size:11px;color:var(--text-2); font-weight:650;margin-bottom:7px; }
    .input-wrap { display:flex;align-items:center;gap:9px; padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface); }
    .input-wrap:focus-within { border-color:var(--primary); }
    .input-wrap svg { color:var(--muted); }
    .input-wrap input { min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);height:42px;font-size:13px; }
    .input-wrap input::placeholder { color:var(--muted); }
    .field + .field { margin-top:13px; }
    .row { display:flex;align-items:center;gap:10px; }
    .space-between { justify-content:space-between; }
    .button { border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:760;transition:.18s ease;color:var(--on-primary);background:var(--primary); }
    .button:hover { filter:brightness(1.08);transform:translateY(-1px); }
    .button:disabled { opacity:.45;cursor:not-allowed;transform:none; }
    .button.secondary { color:var(--primary-text);background:var(--surface-3);border-color:var(--line-2); }
    .button.ghost { background:transparent;color:var(--text-2);border-color:var(--line-2); }
    .button.full { width:100%; }
    .button.sm { min-height:35px;padding:7px 12px; font-size:11px; }
    .button .icon { width:16px;height:16px; }
    .mode-segment { display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px; }
    .mode-segment button { background:transparent;color:var(--muted);border:0;border-radius:8px;min-height:39px;display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px;white-space:nowrap; }
    .mode-segment button.selected { color:var(--primary-text);background:var(--primary-soft); }
    .mode-segment .icon { width:15px;height:15px; }
    .quick-grid { display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0; }
    .quick-tile { padding:14px 12px; background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px; }
    .quick-number { font-weight:750;font-size:22px;letter-spacing:-.6px; }
    .quick-caption { color:var(--muted);font-size:11px;margin-top:6px; }
    .small-badge { display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:750;padding:5px 9px;border-radius:100px;white-space:nowrap; }
    .badge-green {color:var(--low);background:var(--low-bg);border:1px solid var(--line-2);}
    .badge-blue {color:var(--primary-text);background:var(--surface-3);border:1px solid var(--line-2);}
    .badge-amber {color:var(--mid);background:var(--surface-3);border:1px solid var(--line-2);}
    .badge-neutral {color:var(--text-2);background:var(--surface-3);border:1px solid var(--line-2);}
    .badge-red {color:var(--high);background:var(--surface-3);border:1px solid var(--line-2);}
    .badge-rec {color:var(--on-primary);background:var(--primary);border:1px solid var(--primary);}
    .feature-list { display:flex;flex-direction:column;gap:9px; }
    .feature-tile { width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:13px;padding:14px 13px; display:flex;gap:12px;text-align:left;color:var(--text);align-items:center; }
    .feature-tile:hover { background:var(--primary-soft);border-color:var(--line-2); }
    .feature-icon { color:var(--blue);width:34px;height:34px;display:grid;place-items:center;background:var(--surface-3);border-radius:10px; }
    .feature-title {font-size:13px;font-weight:750;}
    .feature-desc {font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
    .feature-tile .next {margin-left:auto;color:var(--muted);}
    .divider {height:1px;background:var(--surface-3);margin:17px 0;}
    .route-card { width:100%;padding:15px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;text-align:left;color:var(--text);display:block;margin-bottom:10px; }
    .route-card:hover {border-color:var(--line-2);}
    .route-card.chosen {background:var(--primary-soft);border:1px solid var(--primary);box-shadow:inset 3px 0 0 var(--primary);}
    .route-card-top { display:flex;justify-content:space-between;gap:8px;align-items:center; }
    .route-name {font-size:13px;font-weight:750;}
    .route-meta {display:flex;align-items:baseline;gap:11px;margin-top:12px;}
    .route-time {font-size:25px;font-weight:780;line-height:1;letter-spacing:-1px;}
    .route-dist {color:var(--text-2);font-size:11px;}
    .route-extra {display:flex;justify-content:space-between;gap:8px;margin-top:13px;font-size:11px;color:var(--text-2);}
    .route-extra strong {color:var(--low);font-weight:700;}
    .score-track {height:6px;width:100%;border-radius:8px;background:var(--surface-3);overflow:hidden;margin-top:9px;}
    .score-fill {height:100%;border-radius:8px;transition:width .25s;}
    .stat-hero {display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .stat-hero strong {font-size:39px;font-weight:800;letter-spacing:-1.5px;}
    .muted-label {color:var(--text-2);font-size:11px;}
    .factor {margin:15px 0;}
    .factor-name {display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;}
    .factor-value {color:var(--text-2);font-size:11px;}
    .factor .score-track {margin:0;height:7px;}
    .hint {background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;color:var(--text-2);font-size:11px;line-height:1.7;}
    .hint svg {display:inline-block;vertical-align:middle;width:14px;height:14px;margin-right:4px;color:var(--blue);}
    .chip-row {display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
    .chip {border:1px solid var(--line-2);background:var(--surface-3);border-radius:100px;color:var(--text-2);padding:7px 11px;font-size:11px;}
    .chip.active {border-color:var(--primary);color:var(--primary-text);background:var(--primary-soft);}
    .departure-row {width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);margin-bottom:8px;}
    .departure-row:hover {border-color:var(--line-2);}
    .departure-row.selected {border-color:var(--primary);background:var(--primary-soft);}
    .time-name {font-size:12px;font-weight:700;min-width:43px;}
    .traffic-track {height:6px;border-radius:100px;background:var(--surface-3);flex:1;overflow:hidden;}
    .traffic-bar {height:100%;border-radius:100px;background:var(--amber);}
    .time-detail {min-width:49px;text-align:right;font-size:11px;color:var(--text);}
    .time-control { width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--primary-text);padding:11px;border-radius:10px; }
    .depart-summary {margin:15px 0;padding:15px;border-radius:13px;background:var(--surface-3);border:1px solid var(--line-2);}
    .depart-summary strong {font-size:23px;letter-spacing:-.5px;}
    .depart-summary p {margin:8px 0 0;font-size:11px;color:var(--text-2);line-height:1.7;}
    .switch-row {display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .switch {border:1px solid var(--line-2);background:var(--surface-3);position:relative;width:44px;height:25px;border-radius:100px;padding:0;flex-shrink:0;transition:.2s;}
    .switch span {position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:.2s;}
    .switch.on {background:var(--primary-strong);border-color:var(--line-2);}
    .switch.on span {transform:translateX(19px);background:var(--on-primary);}
    .flow-row {margin-top:15px;}
    .flow-row-head {display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;}
    .flow-track {height:11px;background:var(--surface-3);border-radius:100px;overflow:hidden;}
    .flow-bar {height:100%;border-radius:100px;transition:width .35s;}
    .flow-help {font-size:10px;color:var(--muted);margin-top:4px;}
    .nav-direction {text-align:left;display:flex;align-items:center;gap:14px;}
    .turn-icon {width:57px;height:57px;flex-shrink:0;display:grid;place-items:center;background:var(--surface-3);border-radius:13px;color:var(--primary);}
    .turn-icon svg {width:31px;height:31px;}
    .nav-next {font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:2px;}
    .progress {height:5px;background:var(--line-2);border-radius:20px;overflow:hidden;margin-top:18px;}
    .progress > div {height:100%;background:var(--primary);transition:width .3s;}

.plan-top input[readonly] {cursor:pointer;}
#homeSearchInput {cursor:pointer;}
.suggest {position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:min(430px,60vh);overflow-y:auto;padding:6px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:0 18px 44px rgb(var(--shadow-rgb) / calc(.35 * var(--shadow-k)));}
.suggest-head {padding:6px 10px 4px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;}
.suggest-item {display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;}
.suggest-item.active {background:var(--primary-soft);}
.suggest-icon {width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);color:var(--primary-text);}
.suggest-icon .icon {width:16px;height:16px;}
.suggest-icon.fav {color:var(--accent);}
.suggest-icon.gps {color:var(--route-c);}
.suggest-icon.place {background:var(--primary);color:var(--on-primary);font-size:13px;}
.suggest-item.active .suggest-icon.place {background:var(--accent);color:#1E2420;}
.suggest-text {flex:1;min-width:0;}
.suggest-text strong {display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.suggest-text strong mark {background:none;color:var(--primary-text);font-weight:800;}
.suggest-text small {display:block;margin-top:2px;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.suggest-away {flex-shrink:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.suggest-status {display:flex;align-items:center;gap:8px;padding:10px;font-size:12px;color:var(--muted);line-height:1.6;}
.suggest-spin {width:14px;height:14px;flex-shrink:0;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--primary);animation:spin .8s linear infinite;}
.sugg-pin {position:relative;width:30px;height:38px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 4px 6px rgb(0 0 0 / .3));}
.sugg-pin::before {content:"";position:absolute;left:1px;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--primary);border:2px solid var(--surface);}
.sugg-pin span {position:absolute;left:0;top:4px;width:30px;text-align:center;color:var(--on-primary);font-size:13px;font-weight:800;}
.sugg-pin.active {z-index:2;}
.sugg-pin.active::before {background:var(--accent);transform:rotate(-45deg) scale(1.15);}
.sugg-pin.active span {color:#1E2420;}

/* ===== 全站拿掉左側欄：地圖 | 資訊面板；返回箭頭負責頁面間移動 ===== */
.sidebar {display:none!important;}
/* 右側欄寬度：一般螢幕 500px，較窄的螢幕自動縮小，至少保留地圖空間 */
:root {--panel-w:clamp(440px, 36vw, 520px);}
.layout {grid-template-columns:minmax(0,1fr) var(--panel-w);}
body:not([data-view="home"]) .app-back {display:flex;width:40px;height:40px;border-radius:12px;}
.toast {left:calc((100vw - var(--panel-w)) / 2);}
.insight-panel:has(> .panel-body) {display:flex;flex-direction:column;padding:0!important;overflow:hidden;}
.panel-body {flex:1;min-height:0;overflow-y:auto;padding:26px 26px 20px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
.panel-footer {flex-shrink:0;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:14px 26px 18px;border-top:1px solid var(--line);background:var(--surface);}
.panel-footer .button {min-height:48px;font-size:14px;}
.panel-footer .button .icon {width:17px;height:17px;}
.route-card {cursor:pointer;}
.route-switch {display:flex;gap:6px;padding:4px;margin:0 0 16px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);}
.route-switch button {flex:1;min-height:36px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13px;font-weight:650;}
.route-switch button.on {background:var(--surface);color:var(--primary-text);box-shadow:0 1px 3px rgb(var(--shadow-rgb) / calc(.2 * var(--shadow-k)));}
.detail-summary {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.detail-summary > div {padding:13px 12px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface-2);}
.detail-summary strong {display:block;margin-top:6px;font-size:24px;font-weight:780;letter-spacing:-.5px;}
.detail-summary strong small {font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;}
.detail-summary strong.good {color:var(--low);}
.detail-tiles {display:grid;gap:9px;margin-bottom:16px;}
.detail-tile {width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);color:var(--text);text-align:left;transition:border-color .15s,background .15s;}
.detail-tile:hover {border-color:var(--primary);background:var(--primary-soft);}
.detail-tile-icon {width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;background:var(--surface);color:var(--primary-text);}
.detail-tile-icon .icon {width:19px;height:19px;}
.detail-tile-text {flex:1;min-width:0;}
.detail-tile-text strong {display:block;font-size:14px;}
.detail-tile-text small {display:block;margin-top:3px;font-size:11.5px;color:var(--muted);line-height:1.5;}
.detail-tile-value {flex-shrink:0;font-size:17px;font-weight:760;color:var(--text);}
.detail-tile-value.good {color:var(--low);}
.detail-tile-value.warn {color:var(--mid);}
.detail-tile-go {color:var(--muted);display:grid;}
.detail-tile-go .icon {width:16px;height:16px;}

/* ===== 路線卡片：標籤 + 三個數字 + 推薦理由；詳情頁分頁 ===== */
.route-card {padding:0;overflow:hidden;}
.route-card .route-choice {display:block;width:100%;padding:15px 16px 13px;}
.route-card-top {display:flex;align-items:center;gap:10px;}
.route-km {font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.route-tags {margin-left:auto;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;}
.panel-heading .route-tags {margin-left:0;justify-content:flex-start;}
.route-stats {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.route-stat {padding:9px 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);}
.route-card.chosen .route-stat {background:var(--surface);}
.route-stat small {display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;}
.route-stat small .icon {width:12px;height:12px;}
.route-stat strong {display:block;margin-top:4px;font-size:20px;font-weight:780;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--text);}
.route-stat strong i {font-style:normal;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;}
.route-stat strong.good {color:var(--low);}
.route-stat strong.warn {color:var(--mid);}
.route-stat strong.bad {color:var(--high);}
.route-stat strong.muted {font-size:13px;font-weight:650;color:var(--muted);padding-top:5px;}
.route-reason {margin:10px 0 0;font-size:11.5px;line-height:1.6;color:var(--text-2);}
.route-footnote {margin:4px 2px 0;font-size:11px;color:var(--muted);}
.detail-tabs {display:grid;grid-template-columns:repeat(4,1fr);margin:4px 0 18px;border-bottom:1px solid var(--line);}
.detail-tabs button {position:relative;min-height:42px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:700;}
.detail-tabs button:hover {color:var(--text);}
.detail-tabs button.on {color:var(--primary-text);}
.detail-tabs button.on::after {content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary);}

/* ===== 詳情頁：全幅地圖 + 可上拉面板 ===== */
.page-title {display:none;margin:0;font-size:19px;font-weight:780;letter-spacing:-.2px;}
.insight-panel.dragging {transition:none!important;user-select:none;}
body:is([data-view="risk"],[data-view="safety"],[data-view="departure"],[data-view="diversion"]) :is(.map-legend,.map-badge,.map-floating-summary) {display:none!important;}
body[data-view="safety"] .map-layer-key {top:70px;bottom:auto;}
body[data-view="risk"] .map-layer-key {display:none!important;}
.sheet-grip {flex-shrink:0;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none;}
.sheet-grip span {width:46px;height:5px;border-radius:5px;background:var(--line-2);}
.sheet-grip:hover span,.sheet-grip:focus-visible span {background:var(--muted);}
.insight-panel.dragging .sheet-grip {cursor:grabbing;}
.sheet-grip ~ .panel-body {padding-top:6px;}
.sheet-head {cursor:auto;}
.sheet-title {display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sheet-title strong {font-size:18px;font-weight:780;}
.sheet-title > span:not(.route-tags) {font-size:13px;color:var(--muted);}
.sheet-head .route-reason {margin:6px 0 12px;}
.sheet-head .route-switch {margin-bottom:10px;}
.sheet-head .detail-tabs {margin-bottom:14px;}
/* 資訊列表（風險分頁） */
.info-block {margin-bottom:14px;padding:4px 16px 8px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface-2);}
.info-block h3 {display:flex;align-items:center;gap:7px;margin:10px 0 4px;font-size:14px;font-weight:760;}
.info-block h3 .icon {width:16px;height:16px;color:var(--primary-text);}
.info-block h3 small {margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
.info-row {display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);}
.info-block h3 + .info-row {border-top:0;}
.info-row > span {font-size:13.5px;color:var(--text-2);}
.info-row > span small {display:block;margin-top:2px;font-size:11px;color:var(--muted);}
.info-row strong {font-size:15px;font-weight:760;text-align:right;font-variant-numeric:tabular-nums;}
.info-row strong.good {color:var(--low);} .info-row strong.warn {color:var(--mid);} .info-row strong.bad {color:var(--high);}
.info-sub {display:flex;justify-content:space-between;padding:12px 0 4px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-2);}
.info-sub small {font-weight:500;color:var(--muted);}
.info-item {width:100%;display:flex;align-items:center;gap:11px;padding:10px 8px;margin:2px -8px;width:calc(100% + 16px);border:0;border-radius:10px;background:none;color:var(--text);text-align:left;}
.info-item:hover {background:var(--surface);}
.info-item > span:nth-child(2) {flex:1;min-width:0;}
.info-item strong {display:block;font-size:13.5px;}
.info-item small {display:block;margin-top:2px;font-size:11px;color:var(--muted);}
.info-item > .icon {width:16px;height:16px;color:var(--muted);}
.info-dot {width:12px;height:12px;flex-shrink:0;border-radius:4px;}
.info-dot.cong {background:#E58A1F;} .info-dot.cong.m3 {background:#D2463A;} .info-dot.cong.m4 {background:#8E1F1A;}
.info-dot.hot {background:var(--high);opacity:.75;border-radius:50%;}
.info-empty {margin:8px 0 10px;font-size:12.5px;color:var(--muted);line-height:1.6;}
/* 地圖：風險摘要卡與路段標籤 */
.risk-cards {display:none;position:absolute;z-index:705;top:18px;left:18px;width:220px;flex-direction:column;gap:8px;}
body.risk-map .risk-cards, body.env-map .risk-cards {display:flex;}
.risk-card {display:flex;align-items:center;gap:12px;padding:9px 13px;border:1px solid color-mix(in srgb,var(--line-2) 70%,transparent);border-radius:14px;background:color-mix(in srgb,var(--surface) 68%,transparent);backdrop-filter:blur(6px);box-shadow:0 10px 26px rgb(var(--shadow-rgb) / calc(.22 * var(--shadow-k)));}
.risk-card small {display:block;font-size:12px;color:var(--text-2);font-weight:650;}
.risk-card strong {display:block;font-size:19px;font-weight:800;line-height:1.25;}
.risk-card strong.good {color:var(--low);} .risk-card strong.warn {color:var(--mid);} .risk-card strong.bad {color:var(--high);} .risk-card strong.muted {color:var(--muted);font-size:14px;}
.risk-card em {display:block;font-style:normal;font-size:10.5px;color:var(--muted);}
.risk-card-icon {width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;}
.risk-card-icon .icon {width:22px;height:22px;}
.risk-card-icon.cong {background:#6E5BD02a;color:#6E5BD0;} .risk-card-icon.acc {background:color-mix(in srgb,var(--high) 16%,transparent);color:var(--high);} .risk-card-icon.safe {background:color-mix(in srgb,var(--low) 16%,transparent);color:var(--low);}
.risk-layers {display:flex;flex-direction:column;gap:6px;padding:9px 13px;border:1px solid color-mix(in srgb,var(--line-2) 70%,transparent);border-radius:14px;background:color-mix(in srgb,var(--surface) 68%,transparent);backdrop-filter:blur(6px);font-size:12.5px;}
.risk-layers label {display:flex;align-items:center;gap:8px;cursor:pointer;}
.risk-layers input {accent-color:var(--primary);width:15px;height:15px;}
.risk-pill {display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border:2px solid #fff;border-radius:999px;color:#fff;font-size:12.5px;font-weight:780;box-shadow:0 6px 16px rgb(0 0 0 / .28);cursor:pointer;white-space:nowrap;}
.risk-pill .icon {width:16px;height:16px;}
.risk-pill.cong {background:#6E5BD0;}
.risk-pill.acc {background:var(--high);}
.risk-pill:hover {transform:scale(1.06);}

/* 詳情面板標題：路線切換放在標題列右側，收到最低時仍看得到分頁 */
body:is([data-view="risk"],[data-view="safety"],[data-view="departure"],[data-view="diversion"]) .map-heading {display:none;}
.sheet-title .route-switch {margin:0 0 0 auto;padding:3px;display:inline-flex;gap:3px;}
.sheet-title .route-switch button {flex:none;min-height:28px;padding:0 13px;font-size:12.5px;}
.sheet-head .route-reason {display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:4px 0 8px;}
.sheet-head .route-reason .route-tags {margin:0;}
.sheet-head .route-reason .route-tags:empty {display:none;}
.sheet-head .detail-tabs {margin-bottom:12px;}
.sheet-head .detail-tabs button {min-height:38px;}

/* 詳情頁回到右側欄；地圖按鈕靠右，風險摘要在左上 */
body:is([data-view="risk"],[data-view="safety"],[data-view="departure"],[data-view="diversion"]) .map-header {justify-content:flex-end;}
.risk-card {box-shadow:0 6px 18px rgb(var(--shadow-rgb) / calc(.12 * var(--shadow-k)));}
.risk-card strong {font-size:17px;}

/* 可收合的資訊區塊（▼ 標題） */
details.info-block > summary {list-style:none;cursor:pointer;}
details.info-block > summary::-webkit-details-marker {display:none;}
details.info-block > summary h3::before {content:"▼";font-size:10px;color:var(--muted);transition:transform .15s;margin-right:2px;}
details.info-block:not([open]) > summary h3::before {transform:rotate(-90deg);}
details.info-block:not([open]) {padding-bottom:4px;}
details.info-block > summary + .info-row {border-top:0;}

/* 安全分頁：夜間環境圖層卡（左下） */
.env-card {display:none;position:absolute;z-index:705;left:18px;bottom:18px;width:300px;padding:13px 16px 11px;border:1px solid color-mix(in srgb,var(--line-2) 70%,transparent);border-radius:16px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(6px);box-shadow:0 8px 22px rgb(var(--shadow-rgb) / calc(.14 * var(--shadow-k)));font-size:13px;color:var(--text);}
body.env-map .env-card {display:block;}
.env-title {display:block;font-size:14.5px;font-weight:780;margin-bottom:9px;}
.env-toggles {display:flex;flex-wrap:wrap;gap:8px 16px;}
.env-toggles label {display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;}
.env-toggles input {accent-color:var(--primary);width:16px;height:16px;}
.env-toggles b {font-weight:780;font-variant-numeric:tabular-nums;}
.env-dot {width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.env-dot.light {background:var(--pt-light);} .env-dot.store {background:var(--low);box-shadow:0 0 0 1.5px #fff;} .env-dot.hot {background:var(--high);opacity:.7;border-radius:3px;width:14px;height:6px;}
.env-card details {margin-top:8px;}
.env-card summary {cursor:pointer;font-size:12px;color:var(--text-2);}
.env-note {margin:6px 0 2px;font-size:11.5px;line-height:1.65;color:var(--muted);}
body[data-view="safety"] .map-layer-key {display:none!important;}

.risk-card-icon.light {background:color-mix(in srgb,var(--pt-light) 20%,transparent);color:var(--pt-light);}
.risk-card-icon.store {background:color-mix(in srgb,var(--low) 18%,transparent);color:var(--low);}
.risk-card-note {display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--muted);margin-top:1px;}

/* ===== 最佳出發時間 ===== */
.dep-form {display:grid;gap:12px;margin-bottom:16px;}
.dep-row {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dep-field {display:grid;gap:6px;}
.dep-field > span {font-size:12px;font-weight:650;color:var(--text-2);}
.dep-field input,.dep-field select {width:100%;height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);color:var(--text);font-size:14px;color-scheme:inherit;}
.dep-field .dep-basis {display:flex;align-items:center;height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface-3);color:var(--text);font-size:14px;font-weight:650;}
.dep-field input:focus,.dep-field select:focus {outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);}
.dep-go {min-height:48px;font-size:14px;}
.dep-result {padding:16px 16px 12px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line-2));border-radius:16px;background:linear-gradient(160deg,var(--primary-soft),var(--surface-2));}
.dep-result.late {border-color:var(--high-line);background:var(--high-bg);}
.dep-kicker {display:block;font-size:12px;font-weight:750;color:var(--primary-text);}
.dep-result.late .dep-kicker {color:var(--high);}
.dep-window {display:block;margin:4px 0 12px;font-size:32px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;color:var(--text);}
.dep-stats {display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dep-stats > div {padding:9px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--line);}
.dep-stats small {display:block;font-size:11px;color:var(--muted);}
.dep-stats b {display:block;margin-top:2px;font-size:16px;font-weight:760;font-variant-numeric:tabular-nums;}
.dep-source {display:block;margin-top:10px;font-size:11.5px;color:var(--primary-text);}
.dep-late-note {margin:0;font-size:13px;line-height:1.7;color:var(--text-2);}
.dep-why {padding:13px 16px 6px;margin-bottom:16px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface-2);}
.dep-why h3,.dep-list h3 {margin:0 0 8px;font-size:14px;font-weight:760;}
.dep-why ul {margin:0;padding-left:18px;}
.dep-why li {margin-bottom:7px;font-size:12.5px;line-height:1.65;color:var(--text-2);}
.dep-list {display:grid;gap:8px;margin-bottom:10px;}
.dep-slot {display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface-2);}
.dep-slot.rec {border:2px solid var(--primary);background:var(--primary-soft);}
.dep-slot.late {opacity:.72;}
.dep-slot.failed {opacity:.6;border-style:dashed;}
.dep-slot-main {display:grid;gap:4px;min-width:0;}
.dep-slot-main strong {display:flex;align-items:center;gap:8px;font-size:14.5px;font-variant-numeric:tabular-nums;}
.dep-slot-main > span:not(.dep-tag) {font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;}
.dep-badge {padding:2px 8px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:10.5px;font-weight:750;}
.dep-tag {justify-self:start;padding:2px 9px;border-radius:999px;background:var(--mid-bg);border:1px solid var(--mid-line);color:var(--mid);font-size:11px;font-weight:700;}
.dep-tag.bad {background:var(--high-bg);border-color:var(--high-line);color:var(--high);}
.dep-slot-add {flex-shrink:0;font-size:11.5px;color:var(--muted);}
.dep-method {margin:4px 0 0;padding:10px 12px;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;background:var(--surface-2);font-size:11.5px;line-height:1.7;color:var(--muted);}

.risk-card.legend .legend-text {display:flex;align-items:center;gap:7px;margin-top:4px;font-size:13px;font-weight:700;color:var(--text);}
.legend-swatch {width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-swatch.light {background:var(--pt-light);box-shadow:0 0 0 1px #1E2420;}
.legend-swatch.store {background:var(--low);box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px color-mix(in srgb,var(--low) 50%,transparent);}
.legend-swatch.acc {width:16px;height:7px;border-radius:4px;background:var(--high);opacity:.55;}
.risk-card.legend em {margin-top:3px;}

.legend-swatch.cong {width:16px;height:6px;border-radius:4px;background:linear-gradient(90deg,#E58A1F,#D2463A);}

/* ===== 協同分流 ===== */
.div-toggle {display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;margin-bottom:18px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface-2);}
.div-toggle strong {display:block;font-size:15px;font-weight:760;}
.div-toggle small {display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.5;}
.div-section-head {display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 10px;}
.div-section-head h3 {margin:0;font-size:15px;font-weight:780;}
.div-section-head small {font-size:11.5px;color:var(--muted);}
.div-tiles {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
.div-tile {display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 8px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);}
.div-tile-icon {color:var(--text-2);margin-bottom:4px;}
.div-tile-icon .icon {width:22px;height:22px;}
.div-tile small {font-size:11.5px;color:var(--text-2);}
.div-tile strong {margin-top:3px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);}
.div-tile strong.good {color:var(--low);}
.div-tile em {margin-top:2px;font-style:normal;font-size:10.5px;color:var(--muted);}
.div-routes {display:grid;gap:8px;margin-bottom:12px;}
.div-route {display:grid;gap:8px;width:100%;padding:12px 14px 12px 16px;border:1px solid var(--line-2);border-left:4px solid var(--rc);border-radius:13px;background:var(--surface-2);color:var(--text);text-align:left;}
.div-route:hover {border-color:var(--rc);}
.div-route.sel {border:2px solid var(--rc);border-left-width:4px;background:color-mix(in srgb,var(--rc) 9%,var(--surface-2));}
.div-route-head {display:flex;justify-content:space-between;gap:10px;}
.div-route-head strong {font-size:14px;color:var(--rc);}
.div-route-head span {font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.div-bar {height:7px;border-radius:7px;background:var(--line);overflow:hidden;}
.div-bar i {display:block;height:100%;border-radius:7px;background:var(--rc);transition:width .3s;}
.div-route small {font-size:11.5px;line-height:1.6;color:var(--muted);}
.div-note {margin:0 2px 10px;font-size:12px;line-height:1.7;color:var(--text-2);}
.risk-pill.divl {padding:5px 11px;border:1px solid rgb(255 255 255 / .55);font-size:12px;font-weight:650;letter-spacing:.02em;color:#fff;text-shadow:none;
  background:color-mix(in srgb,var(--rc) 72%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 2px 8px rgb(0 0 0 / .14);transition:opacity .15s,background .15s;}
.risk-pill.divl.on {background:color-mix(in srgb,var(--rc) 82%,transparent);box-shadow:0 3px 10px rgb(0 0 0 / .18);}
.risk-pill.divl:not(.on) {opacity:.55;padding:4px 9px;font-size:11px;box-shadow:none;}
.risk-pill.divl:not(.on):hover {opacity:.85;}

/* Google 底圖的標誌與版權文字（使用 Google 圖磚時必須顯示） */
.google-attrib {position:absolute;right:10px;bottom:8px;z-index:5;display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--surface) 80%,transparent);font-size:10.5px;color:var(--text-2);pointer-events:none;max-width:60%;}
.google-attrib .g-logo {font:600 13px/1 Arial,Helvetica,sans-serif;letter-spacing:-.2px;color:var(--text);}
.google-attrib .g-copy {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 按鈕、分頁、標籤點擊時不要反白選取文字（連點兩下也不會出現藍色選取框） */
button, [role="button"], .mode-segment, .detail-tabs, .section-heading, .input-label, .risk-pill, .fav-chip {-webkit-user-select:none;user-select:none;}
button:focus:not(:focus-visible) {outline:none;}

/* 安全分數等級與「分數相近」說明 */
.grade-tag {margin-left:auto;padding:0 6px;border-radius:6px;font-style:normal;font-size:10.5px;font-weight:700;line-height:17px;white-space:nowrap;letter-spacing:.02em;}
.grade-tag.g-good {color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);}
.grade-tag.g-mid {color:var(--mid);background:color-mix(in srgb,var(--mid) 15%,transparent);}
.grade-tag.g-low {color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent);}
.safety-context {display:flex;gap:9px;align-items:flex-start;margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--primary) 6%,var(--surface-2));font-size:12.5px;line-height:1.7;color:var(--text-2);}
.safety-context .icon {width:16px;height:16px;margin-top:3px;color:var(--primary-text);flex-shrink:0;}

/* 安全分頁：事故明細表 */
.acc-detail-btn {margin-left:auto;padding:3px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--primary-text);font-size:11.5px;font-weight:700;cursor:pointer;}
.acc-detail-btn:hover, .acc-detail-btn.on {background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
.acc-table {margin:8px 0 6px;display:flex;flex-direction:column;gap:8px;}
.acc-table-head {display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:750;color:var(--text);}
.acc-table-head small {margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
.acc-table-scroll {max-height:340px;overflow:auto;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);}
.acc-table table {width:100%;border-collapse:collapse;font-size:12px;line-height:1.5;}
.acc-table th {position:sticky;top:0;z-index:1;background:var(--surface-3);color:var(--text-2);font-weight:700;text-align:left;padding:8px 9px;white-space:nowrap;}
.acc-table td {padding:8px 9px;border-top:1px solid var(--line);color:var(--text);vertical-align:top;}
.acc-table td:first-child {white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text-2);}
.acc-table td:nth-child(3) {white-space:nowrap;color:var(--text-2);}
.acc-table .acc-num {text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.acc-table td.acc-fatal {color:var(--high);font-weight:700;}
.acc-table tbody tr {cursor:pointer;}
.acc-table tbody tr:hover {background:color-mix(in srgb,var(--primary) 7%,transparent);}
.acc-muted {color:var(--muted);}
.acc-note {margin:0;font-size:11px;color:var(--muted);}

/* 圖示：統一線條粗細與端點 */
.icon {fill:currentColor;stroke:none !important;}
.factor-heading {display:flex;align-items:center;gap:7px;}
.factor-heading .icon {width:16px;height:16px;color:var(--primary-text);}
/* 交通工具：選中的按鈕用實心主題色 */
.mode-segment button {transition:background .15s,color .15s,box-shadow .15s;}
.mode-segment button:hover:not(.selected) {background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--text);}
.mode-segment button.selected {background:var(--primary);color:var(--on-primary);font-weight:750;box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 35%,transparent);}
.mode-segment button.selected .icon {color:var(--on-primary);}
.mode-segment button .icon {width:21px;height:21px;}
@media (max-width:1360px) {
  :root {--panel-w:440px;}
  .top-note {display:none;}
}

/* ===== SafeFlow — Mobile layout (手機版) =====
   同一份頁面、同一組色票；寬度 ≤ 760px 時改為：標題列｜地圖｜可捲動面板｜底部導覽列 */
.m-tabbar,.m-map-fabs {display:none;}
/* 手機版詳情頁標題列（路線摘要＋路線切換） */
.m-route-head {display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-bottom:14px;}
.m-route-head strong {font-size:17px;font-weight:800;}
.m-route-head > span {font-size:13px;color:var(--muted);}
.m-route-head .route-switch,.m-ov-tools .route-switch {margin:0 0 0 auto;padding:3px;display:inline-flex;gap:3px;}
.m-route-head .route-switch button,.m-ov-tools .route-switch button {flex:none;min-height:30px;padding:0 12px;font-size:12.5px;}
/* 手機版「風險」分頁：風險總覽（依手機設計稿） */
.m-ov-head {display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:2px 0 14px;}
.m-ov-head h2 {margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;}
.m-ov-tools {margin-left:auto;display:flex;align-items:center;gap:8px;}
.m-help {width:36px;height:36px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--text);}
.m-help .icon {width:28px;height:28px;}
.m-help[aria-expanded="true"] {color:var(--primary-text);background:var(--primary-soft);}
.m-ov {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px;}
.m-ov-level {--lv:var(--muted);--lv-bg:var(--surface);--lv-line:var(--line-2);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:16px;border:1px solid var(--lv-line);border-radius:18px;background:var(--lv-bg);color:var(--lv);min-width:0;}
.m-ov-level.low {--lv:var(--low);--lv-bg:var(--low-bg);--lv-line:var(--low-line);}
.m-ov-level.mid {--lv:var(--mid);--lv-bg:var(--mid-bg);--lv-line:var(--mid-line);}
.m-ov-level.high {--lv:var(--high);--lv-bg:var(--high-bg);--lv-line:var(--high-line);}
.m-ov-level > .icon {width:clamp(40px,calc(var(--frame-w) * .12),52px);height:auto;flex-shrink:0;}
.m-ov-level > div {min-width:0;}
.m-ov-level strong {display:block;font-size:clamp(19px,calc(var(--frame-w) * .056),24px);font-weight:850;letter-spacing:.3px;white-space:nowrap;line-height:1.2;}
.m-ov-level small {display:block;margin-top:8px;font-size:13px;color:var(--text-2);}
.m-ov-level b {display:block;margin-top:4px;font-size:clamp(24px,calc(var(--frame-w) * .074),32px);font-weight:800;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;}
.m-ov-level b span {font-size:13px;font-weight:500;color:var(--muted);}
.m-ov-stats {display:grid;gap:10px;min-width:0;}
.m-ov-stat {display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);}
.m-ov-stat > span:last-child {min-width:0;}
.m-ov-stat small {display:block;font-size:12.5px;line-height:1.35;color:var(--text-2);}
.m-ov-stat strong {display:block;margin-top:3px;font-size:19px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.m-ic {position:relative;flex-shrink:0;display:grid;place-items:center;}
.m-ic .icon {width:26px;height:26px;}
.m-ic .icon path[opacity] {opacity:1;}
.m-ic.light {color:var(--pt-light);} .m-ic.store {color:var(--low);} .m-ic.acc {color:var(--high);}
.m-ic.acc::after {content:"!";position:absolute;top:-4px;right:-6px;width:13px;height:13px;border-radius:50%;background:var(--high);color:var(--surface);font:800 9px/13px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 1.5px var(--surface);}
.m-ov-note {margin-bottom:14px;}
@media (max-width:340px) { .m-ov {grid-template-columns:1fr;} }

/* 一律使用手機版面（電腦上以手機外框置中顯示，見下方） */
@media all {
  :root {--frame-w:100vw;}
  :root {--m-top:56px;--m-map:42dvh;}
  html,body {height:100%;}
  body {min-width:0;overflow:hidden;}
  .app {height:100vh;height:100dvh;min-height:0;}

  /* 標題列：返回｜頁面名稱｜設定；首頁顯示品牌 */
  .topbar {flex:0 0 var(--m-top);height:var(--m-top);padding:0 8px 0 4px;gap:4px;border-bottom:0;background:var(--bg);}
  .topbar .brand,.brand-sub,.top-note,.demo-pill {display:none!important;}
  body[data-view="home"] .topbar {padding-left:16px;background:var(--surface);}
  body[data-view="home"] .topbar .brand {display:flex!important;gap:10px;}
  body[data-view="home"] .brand-mark {width:34px;height:34px;}
  body[data-view="home"] .brand-name {font-size:17px;}
  .page-title {display:block;flex:1;min-width:0;padding-left:4px;font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  body[data-view="home"] .page-title {display:none;}
  body:not([data-view="home"]) .app-back {width:42px;height:42px;border:0;background:transparent;color:var(--text);}
  .app-back .icon {width:26px;height:26px;}
  .settings-btn {width:42px;height:42px;border:0;background:transparent;color:var(--text);}
  .settings-btn .icon {width:27px;height:27px;}
  .account-menu {width:min(260px,calc(var(--frame-w) - 24px));}

  /* 首頁：搜尋列在上、常用地點橫向捲動 */
  .home-toolbar {flex-direction:column;align-items:stretch;gap:10px;padding:2px 16px 12px;}
  .home-search {flex:none;height:46px;}
  .fav-area {gap:8px;}
  .fav-label {display:none;}
  .fav-chip {height:36px;max-width:150px;font-size:12.5px;}
  .fav-star {width:36px;height:36px;}
  .fav-anchor {position:static;}
  .fav-pop {left:12px;right:12px;top:calc(100% + 4px);width:auto;z-index:80;max-height:70dvh;overflow-y:auto;}

  /* 地圖在上、面板在下 */
  .layout,body[data-view] .layout {display:flex;flex-direction:column;flex:1;min-height:0;height:auto;}
  .map-shell {flex:0 0 var(--m-map);min-height:0;height:auto;}
  body[data-view="home"] .map-shell,.focus-mode .map-shell {flex:1 1 auto;}
  body[data-view="plan"] {--m-map:28dvh;}
  body[data-view="compare"] {--m-map:36dvh;}
  body[data-view="drive"] {--m-map:40dvh;}
  .insight-panel {flex:1 1 auto;min-height:0;padding:18px 16px 22px;border-left:0;border-top:1px solid var(--line);background:var(--bg);}
  .panel-body {padding:18px 16px 20px;}
  .panel-footer {padding:10px 16px 12px;background:var(--bg);}
  .panel-title {font-size:21px;}

  /* 地圖上的浮動元件：只留圖層卡、指北針、定位 */
  .map-header,.map-legend,.map-badge,.map-layer-key,.risk-cards,.map-quick-search,.scale-note {display:none!important;}
  .map-floating-summary {left:12px;right:12px;bottom:16px;width:auto;}
  .m-map-fabs {display:flex;flex-direction:column;gap:12px;position:absolute;right:12px;bottom:34px;z-index:720;}
  body[data-view="home"]:has(.map-floating-summary.has-route) .m-map-fabs {bottom:88px;}
  .m-fab {width:48px;height:48px;padding:0;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);color:var(--text);box-shadow:0 4px 14px rgb(var(--shadow-rgb) / calc(.22 * var(--shadow-k)));}
  .m-fab .icon {width:26px;height:26px;}
  .m-fab.busy .icon {animation:spin 1s linear infinite;}
  .env-card {left:auto;right:12px;top:12px;bottom:auto;width:auto;padding:11px 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);}
  .env-toggles {flex-direction:column;gap:10px;}
  .env-toggles label {gap:10px;font-size:15px;}
  .env-toggles input {width:22px;height:22px;margin:0;}

  /* 底部導覽列 */
  .m-tabbar {display:grid;grid-template-columns:repeat(3,1fr);flex:0 0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--nav-bg);z-index:50;}
  .m-tabbar button {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:0;border:0;background:none;color:var(--nav-fg);font-size:12px;font-weight:650;}
  .m-tabbar .icon {width:25px;height:25px;}
  .m-tabbar button.on {color:var(--nav-on);font-weight:800;}
  .m-tabbar button.on .icon path[opacity] {opacity:1;}

  /* 專注導航：全螢幕地圖 */
  .focus-mode .m-tabbar,.focus-mode .m-map-fabs {display:none;}
  .focus-mode .drive-overlay {top:12px;left:12px;right:12px;}
  .focus-mode .drive-overlay-card {width:100%;}
  .focus-mode .focus-controls {bottom:calc(20px + env(safe-area-inset-bottom));}
  .focus-mode .focus-controls .button {min-width:0;padding:10px 16px;}

  /* 地圖版權文字縮成一行 */
  .maplibregl-ctrl-attrib-inner {white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib {max-width:calc(var(--frame-w) - 20px);}

  /* 提示訊息置中、在標題列下方（不擋住面板按鈕與導覽列） */
  .toast,body[data-view] .toast,.focus-mode .toast {left:50%;top:calc(var(--m-top) + 10px);bottom:auto;transform:translate(-50%,-12px);min-width:0;width:max-content;max-width:calc(var(--frame-w) - 32px);}
  .toast.show,body[data-view] .toast.show {transform:translate(-50%,0);}
  .focus-mode .toast {top:110px;}
  .panel-kicker {display:none;}

  /* 面板內容：窄螢幕微調 */
  .plan-top {padding:14px;}
  .suggest {max-height:min(360px,50dvh);}
  .route-stats {gap:6px;}
  .route-stat {padding:8px;}
  .route-stat strong {font-size:18px;}
  .div-tiles {gap:6px;}
  .acc-table-scroll {max-height:300px;}
}
/* ===== 手繪稿版面調整（只用既有色票） ===== */
/* 首頁：常用地點移到底部「常用／收藏」分頁 */
.home-toolbar .fav-area {display:none;}
/* 規劃頁：輸入區在上、地圖在下 */
body[data-view="plan"] .insight-panel {order:-1;flex:0 0 auto;position:relative;z-index:6;overflow:visible;padding:4px 16px 14px;border-top:0;border-bottom:1px solid var(--line);}
body[data-view="plan"] .map-shell {flex:1 1 auto;}
.m-plan .plan-name-row {margin-bottom:12px;}
.m-plan .field + .field {margin-top:8px;}
.m-plan .input-wrap {background:var(--surface);}
.m-plan .input-wrap input {height:44px;font-size:15px;}
.m-plan .input-wrap > .icon {color:var(--high);}
.m-gps {display:grid;place-items:center;color:var(--primary-text);}
.m-gps .icon {width:20px;height:20px;}
.m-plan .mode-segment {margin-bottom:12px;background:var(--surface);}
.m-plan .mode-segment button {min-height:44px;font-size:14px;}
.m-plan .button.full {min-height:48px;font-size:15px;}
/* 路線列表：拖拉把手、隱藏大標題 */
body[data-view="compare"] .panel-heading {display:none;}
.m-grip {flex-shrink:0;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none;background:var(--bg);}
.m-grip span {width:44px;height:5px;border-radius:5px;background:var(--line-2);}
.m-grip ~ .panel-body {padding-top:4px;}
.panel-footer:has(> :only-child) {grid-template-columns:1fr;}
/* 路線詳情：分頁 */
.insight-panel .detail-tabs {margin:0 0 14px;}
.insight-panel .detail-tabs button {font-size:15px;min-height:44px;}
/* 安全總覽：三張卡片可點 */
button.m-ov-stat {width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;}
button.m-ov-stat:hover {border-color:var(--primary);background:var(--primary-soft);}
.m-ov-go {margin-left:auto;color:var(--muted);display:grid;}
.m-ov-go .icon {width:16px;height:16px;}
/* 安全詳細清單 */
.m-sd-head {display:flex;align-items:center;gap:10px;margin:2px 0 14px;}
.m-sd-head strong {display:block;font-size:18px;font-weight:800;}
.m-sd-head small {display:block;margin-top:2px;font-size:12px;color:var(--muted);}
.m-sd-back {width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);color:var(--text);}

  } catch { return make(); }
}

/* ---------------- API ---------------- */
async function api(path, { method = 'GET', body, timeout = 30000 } = {}) {
  let res;
  try {
    res = await fetch(new URL(path, API_BASE), {
      method, headers: { Accept: 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined, signal: AbortSignal.timeout(timeout),
    });
  } catch (e) {
    throw Error(e.name === 'TimeoutError' ? '後端回應逾時，請稍後再試' : `無法連線到後端（${API_BASE}），請確認 start-navigation.cmd 已啟動`);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Error(data.detail || data.error || `後端回應 HTTP ${res.status}`);
  return data;
}

async function geocode(text, near) {
  const m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) {
    const lat = Number(m[1]), lon = Number(m[2]);
    if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { coords: [lon, lat], name: text };
  }
  const params = new URLSearchParams({ q: text });
  if (near) { params.set('nearLon', near[0]); params.set('nearLat', near[1]); }
  const data = await api(`/api/smart-geocode?${params}`, { timeout: 25000 });
  const r = data.result;
  if (!r || !num(Number(r.lat)) || !num(Number(r.lon))) throw Error(`找不到地點：「${text}」`);
  return { coords: [Number(r.lon), Number(r.lat)], name: r.displayName || text, address: r.address };
}

function extractSteps(r) {
  const legs = r.legs || r.raw?.legs || [];
  const steps = [];
  for (const leg of legs) for (const s of leg?.steps || []) {
    const type = s.valhalla?.type ?? null;
    const text = s.valhalla?.instruction || (s.name ? `沿 ${s.name} 前進` : '繼續前進');
    steps.push({ text, name: s.name || '', distance: Number(s.distance) || 0, duration: Number(s.duration) || 0,
      coord: s.geometry?.coordinates?.[0] || null, icon: [9, 10, 11].includes(type) ? 'right' : [14, 15, 16].includes(type) ? 'left' : [4, 5, 6].includes(type) ? 'flag' : 'straight' });
  }
  if (!steps.length) steps.push({ text: '沿路線前進', distance: (r.distance || 0), coord: r.geometry.coordinates[0], icon: 'straight' });
  if (steps.at(-1).icon !== 'flag') steps.push({ text: '抵達目的地', distance: 0, coord: r.geometry.coordinates.at(-1), icon: 'flag' });
  return steps;
}

function normalizeRoutes(list) {
  return list.filter(r => r?.geometry?.type === 'LineString' && r.geometry.coordinates?.length >= 2).slice(0, 3).map((r, i) => ({
    index: i, id: String.fromCharCode(65 + i),
    minutes: num(r.expectedMin) ? r.expectedMin : Number(r.duration) / 60,
    distanceKm: num(r.distanceKm) ? r.distanceKm : Number(r.distance) / 1000,
    coords: r.geometry.coordinates, geometry: r.geometry,
    engine: r.routingEngine || r.raw?.routingEngine || '', candidate: r.candidateType || null,
    eta: { worst10: r.worst10Min ?? null, riskStatus: r.riskStatus || null, stability: r.stabilityLevel || null,
      sampleCount: r.riskSampleCount ?? 0, confidence: r.etaConfidence || null, traffic: r.trafficDescription || null,
      delay: r.delayMin ?? 0, liveCoverage: r.combinedLiveCoverageRatio ?? null, incidents: r.incidents || [],
      routeType: r.routeType || null, source: r.trafficSource || null, congestion: (r.congestionSegments || []).filter(c => Array.isArray(c?.coords) && c.coords.length >= 2), historic: num(r.historicMin) ? r.historicMin : null, freeFlow: num(r.freeFlowMin) ? r.freeFlowMin : null },
    steps: extractSteps(r),
  }));
}

async function fetchRoutes(start, end, mode, departureTime, { safety = true } = {}) {
  const q = new URLSearchParams({ startLon: start[0], startLat: start[1], endLon: end[0], endLat: end[1] });
  /* safety=0：不另外產生「避開事故熱點」的候選路線（最佳出發時間逐時段查詢只要最快路線） */
  if (!safety) q.set('safety', '0');
  if (mode === 'car') {
    /* TDX 無法使用：汽車路線改由後端用 TomTom 即時／歷史路況計算，失敗時後端退回本機 Valhalla */
    q.set('mode', 'car');
    if (departureTime) q.set('departureTime', departureTime);
    const data = await api(`/api/navigation/route?${q}`, { timeout: 30000 });
    if (!departureTime) state.carFallback = data.trafficSource !== 'TomTom';
    return data.routes || [];
  }
  q.set('mode', mode);
  return (await api(`/api/navigation/route?${q}`, { timeout: 45000 })).routes || [];
}

async function analyzeRoutes() {
  if (!state.routes.length) return;
  state.analyzing = true; state.analyzeError = null; state.points = {}; renderAll();
  try {
    state.plan = await api('/api/navigation/analyze', { method: 'POST', timeout: 60000, body: {
      participantId: state.participant, mode: state.mode, night: true, distribution: state.diversion,
      tripLabel: `${state.startName} → ${state.endName}`.slice(0, 250),
      routes: state.routes.map(r => ({ geometry: r.geometry, expectedMin: Math.min(1440, Math.max(0.1, r.minutes)) })),
    } });
    /* 預設選取系統推薦的路線（使用者自己點過其他路線就不覆蓋）；沒有推薦時維持最快路線 */
    if (state.plan?.recommendedIndex != null && !state.userPicked && state.routes[state.plan.recommendedIndex]) state.selected = state.plan.recommendedIndex;
  } catch (e) {
    state.plan = null; state.analyzeError = e.message;
  } finally { state.analyzing = false; renderAll(); if (['safety', 'risk'].includes(state.view)) loadPoints(); }
}

async function loadPoints() {
  const r = route(), row = planRow(r);
  if (!r || !row || state.points[row.key] || !state.plan) return;
  state.points[row.key] = 'loading';
  try {
    state.points[row.key] = await api('/api/navigation/map-points', { method: 'POST', body: { participantId: state.participant, planId: state.plan.planId, routeKey: row.key } });
  } catch (e) { state.points[row.key] = { error: e.message }; }
  renderMap(); if (['safety', 'risk'].includes(state.view)) renderPanel();
}

async function planTrip() {
  if (state.busy) return;
  state.busy = true; stopDriving();
  const btn = $('#planForm button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = '搜尋地點中…'; }
  $('#mapDataBadge').textContent = '正在搜尋地點與路線…';
  $('#routeError')?.remove();
  try {
    const a = state.startCoords && state.origin === state.startName ? { coords: state.startCoords, name: state.startName } : await geocode(state.origin);
    const b = state.endCoords && state.destination === state.endName ? { coords: state.endCoords, name: state.endName } : await geocode(state.destination, a.coords);
    state.startCoords = a.coords; state.startName = a.name; state.origin = a.name;
    state.endCoords = b.coords; state.endName = b.name; state.destination = b.name;
    if (btn) btn.textContent = '規劃路線中…';
    const found = normalizeRoutes(await fetchRoutes(a.coords, b.coords, state.mode));
    if (!found.length) throw Error('後端沒有回傳可用路線');
    state.routes = found; state.selected = found.reduce((a, b) => (b.minutes < a.minutes ? b : a)).index; state.userPicked = false; state.plan = null; state.departures = null; if (state.dep) { state.dep.results = []; state.dep.error = null; } state.step = 0;
    setView('compare'); fitRoute();
    toast(state.mode === 'car' && state.carFallback ? `即時路況暫時無法取得，先用路網估算顯示 ${found.length} 條路線` : `已取得 ${found.length} 條${MODE_LABEL[state.mode]}路線，正在計算安全分數…`);
    analyzeRoutes();
  } catch (e) {
    console.error(e); toast(e.message);
    const hint = document.createElement('p'); hint.id = 'routeError'; hint.className = 'hint'; hint.setAttribute('role', 'alert');
    hint.style.borderColor = 'var(--high-line)'; hint.textContent = `查詢失敗：${e.message}`; $('#planForm')?.after(hint);
    renderMap();
  } finally {
    state.busy = false;
    const b2 = $('#planForm button[type=submit]'); if (b2) { b2.disabled = false; b2.innerHTML = isMobile() ? '規劃路線' : `查詢路線 ${icon('arrow')}`; }
  }
}

let meMarker = null;
const circlePolygon = ([lon, lat], meters, steps = 64) => {
  const coords = [];
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * 2 * Math.PI, dx = meters * Math.cos(a), dy = meters * Math.sin(a);
    coords.push([lon + dx / (111320 * Math.cos(lat * Math.PI / 180)), lat + dy / 110540]);
  }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] }, properties: {} };
};

function renderMe() {

/* 後端推薦規則的角色（最快／平衡／最安全）與推薦原因；安全分析完成後以後端結果為準 */
const ROLE_TAG = { fastest: ['最快', 'badge-blue'], balanced: ['平衡', 'badge-amber'], safest: ['最安全', 'badge-green'] };
const ROLE_NAME = { fastest: '最快', balanced: '平衡', safest: '最安全' };
const roleName = r => (planRow(r)?.roles || []).map(k => ROLE_NAME[k]).join('・');
function routeInsights() {
  const rs = state.routes, out = rs.map(() => ({ tags: [], reason: '' }));
  if (!rs.length) return out;
  if (state.plan?.routes?.some(p => Array.isArray(p.roles))) {
    return rs.map(r => {
      const p = planRow(r), tags = [];
      if (p?.recommended) tags.push(['推薦', 'badge-rec']);
      for (const k of p?.roles || []) tags.push(ROLE_TAG[k]);
      if (!tags.length) tags.push(['備選', 'badge-neutral']);
      const reason = p?.recommended && state.plan.recommendation?.why ? `推薦原因：${state.plan.recommendation.why}` : p?.summary || '';
      return { tags, reason: reason + (r.candidate === 'safety' ? '（此路線為系統刻意避開事故熱點產生）' : '') };
    });
  }
  if (rs.length === 1) { out[0].reason = '目前只找到這一條路線'; return out; }
  const rec = state.plan?.recommendedIndex;
  const sc = r => planRow(r)?.safety?.score ?? null;
  const spread = r => state.mode === 'car' && num(r.eta.worst10) ? Math.max(0, r.eta.worst10 - r.minutes) : null;
  const pick = (list, better) => list.length > 1 ? list.reduce((a, b) => better(b, a) ? b : a) : null;
  const fastest = pick(rs, (b, a) => b.minutes < a.minutes);
  const safes = rs.filter(r => sc(r) != null), safest = pick(safes, (b, a) => sc(b) > sc(a));
  const stables = rs.filter(r => spread(r) != null), stablest = pick(stables, (b, a) => spread(b) < spread(a));
  const shortest = pick(rs, (b, a) => b.distanceKm < a.distanceKm);
  const delays = rs.filter(r => r.eta.source === 'TomTom' && num(r.eta.delay));
  const smoothest = delays.length > 1 && Math.max(...delays.map(r => r.eta.delay)) - Math.min(...delays.map(r => r.eta.delay)) >= 1 ? pick(delays, (b, a) => b.eta.delay < a.eta.delay) : null;
  rs.forEach((r, i) => {
    const o = out[i], s = sc(r), bits = [];
    if (rec === r.index) o.tags.push(['系統推薦', 'badge-green']);
    if (r === fastest) o.tags.push(['最快', 'badge-blue']);
    if (r === safest) o.tags.push(['最安全', 'badge-green']);
    if (r === stablest) o.tags.push(['最穩定', 'badge-amber']);
    if (r === shortest && r !== fastest) o.tags.push(['最短', 'badge-neutral']);
    if (r === smoothest) o.tags.push(['最順暢', 'badge-amber']);
    if (r === fastest) { const gap = Math.min(...rs.filter(x => x !== r).map(x => x.minutes - r.minutes)); bits.push(gap >= 1 ? `比其他路線快 ${Math.round(gap)} 分鐘` : '時間最短'); }
    else bits.push(`比最快路線多 ${Math.max(1, Math.round(r.minutes - fastest.minutes))} 分鐘`);
    if (s != null && safest) {
      if (r === safest) { const lead = Math.min(...safes.filter(x => x !== r).map(x => s - sc(x))); bits.push(lead >= 1 ? `安全分數最高，多 ${Math.round(lead)} 分` : '安全分數最高'); }
      else if (sc(safest) - s >= 3) bits.push(`安全分數低 ${Math.round(sc(safest) - s)} 分`);
    }
    if (spread(r) != null) { if (r === stablest) bits.push(`塞車時最多只多 ${Math.round(spread(r))} 分鐘`); else if (spread(r) >= 8) bits.push(`尖峰可能多 ${Math.round(spread(r))} 分鐘`); }
    if (r.eta.source === 'TomTom' && num(r.eta.delay) && r.eta.delay >= 2) bits.push(`目前塞車多 ${Math.round(r.eta.delay)} 分鐘`);
    else if (r === smoothest) bits.push('目前路況最順');
    if (rec === r.index && state.diversion && planRow(r)?.count != null) bits.push(`近 ${state.plan.windowMinutes} 分鐘 ${planRow(r).count} 人選擇`);
    o.reason = (rec === r.index ? '推薦原因：' : '') + bits.join('，');
  });
  /* 沒有拿到任何標籤的路線：找出它在單項指標上的優勢，說明為什麼也列出來 */
  const fac = (r, k) => planRow(r)?.safety?.factors?.[k] ?? null;
  const best = (k, label, why) => {
    const list = rs.filter(r => fac(r, k) != null); if (list.length < 2) return null;
    const top = list.reduce((a, b) => (fac(b, k) > fac(a, k) ? b : a)), second = Math.max(...list.filter(x => x !== top).map(x => fac(x, k)));
    return fac(top, k) - second >= 2 ? { r: top, label, why } : null;

    const el = document.createElement('button'); el.type = 'button';
    const on = x.index === state.selected;
    el.className = `risk-pill divl ${on ? 'on' : ''}`; el.style.setProperty('--rc', routeColor(x.index));
    el.innerHTML = `<span>${text}</span>`; el.title = on ? `目前選擇：路線 ${x.id}` : `改選路線 ${x.id}`;
    el.addEventListener('click', () => setRoute(x.index));
    el.style.zIndex = on ? '3' : '1';
    riskPills.push(new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(c).addTo(map));
  });
}

/* 安全分頁：左下角「夜間環境」圖層卡（路燈、便利商店附總數；事故密集路段不顯示數量） */

    <details data-block="envhelp" ${open}><summary>圖層說明</summary><p class="env-note">地圖縮小時，相近的點會合併成數字圓圈，點圓圈可放大；放大後顯示每一個點位，點一下可看詳細資料。淡紅色路段是歷史事故比較集中的地方。${cut.length ? ' 點位太多時地圖只顯示一部分代表點，數字為全部數量。' : ''}${pts?.note ? ` ${esc(pts.note)}` : ''}</p></details>`;
}
document.addEventListener('change', e => {

function focusRiskSegment(key) {
  const [kind, idx] = String(key).split(':'), r = route(); if (!r) return;
  const seg = kind === 'cong' ? (r.eta.congestion || [])[Number(idx)] : routePoints(r)?.accidentHotspots?.hotspots?.[Number(idx)];
  if (!seg?.coords?.length) return;
  const b = new maplibregl.LngLatBounds(); seg.coords.forEach(c => b.extend(c));
  map.fitBounds(b, { padding: mapPadding(), maxZoom: 16.5, duration: 600 });
  const html = kind === 'cong'
    ? `<strong>${CONG_CAT[seg.category] || '車多'}</strong><br>約 ${fmtDist(seg.lengthM)}${num(seg.speedKmh) ? `，時速約 ${Math.round(seg.speedKmh)} km` : ''}${seg.delayMin >= 0.5 ? `<br>延誤約 ${fmtMin(seg.delayMin)} 分鐘` : ''}<br><span style="opacity:.7">TomTom 即時路況</span>`
    : `<strong>事故熱點${roadAt(r, (seg.fromM + seg.toM) / 2) ? ` · ${esc(roadAt(r, (seg.fromM + seg.toM) / 2))}` : ''}</strong><br>距起點 ${(seg.fromM / 1000).toFixed(1)}–${(seg.toM / 1000).toFixed(1)} 公里<br>歷史事故比沿線其他路段集中`;
  riskPopup?.remove();
  riskPopup = new maplibregl.Popup({ offset: 12, closeOnClick: false, maxWidth: '260px' }).setLngLat(kind === 'cong' ? midCoord(seg.coords) : seg.center).setHTML(html).addTo(map);
}
/* 記住使用者收合了哪些區塊，切換路線或重新整理面板時保持一致 */
document.addEventListener('toggle', e => { const k = e.target?.dataset?.block; if (k) (state.closedBlocks ||= {})[k] = !e.target.open; }, true);
